<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caption Translator</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="top">
    <span class="logo">💬</span>
    <span class="title">Caption Translator</span>
    <span class="spacer"></span>
    <div class="dd">
      <button id="lang-btn" class="icon-btn flag-btn" data-i18n-title="uilang.title" type="button"></button>
      <div id="lang-menu" class="menu hidden"></div>
    </div>
    <button id="pip-btn" class="icon-btn" data-i18n-title="pip.title" type="button">📌</button>
    <button id="popout-btn" class="icon-btn" data-i18n-title="popout.title" type="button">⧉</button>
    <button id="settings-btn" class="icon-btn" data-i18n-title="settings" type="button">⚙️</button>
  </header>

  <!-- Cài đặt (ẩn/hiện) -->
  <section id="settings" class="settings hidden">
    <label class="fld">
      <span data-i18n="settings.apiKey">Gemini API key</span>
      <input id="apikey" type="password" data-i18n-ph="apiKey.ph" placeholder="AIza…" autocomplete="off" spellcheck="false" />
    </label>
    <div class="key-status" id="key-status"></div>
    <div class="fld">
      <span data-i18n="settings.source">Nguồn âm thanh</span>
      <select id="source">
        <option value="mic" data-i18n="source.mic">🎤 Micro</option>
        <option value="screen" data-i18n="source.screen">🔊 Âm thanh (tab / màn hình / cửa sổ)</option>
      </select>
    </div>
    <div class="fld">
      <span data-i18n="settings.layout">Giao diện dịch</span>
      <div class="layout-pick" id="layout-pick">
        <button class="lay-opt" data-layout="translation" data-i18n-title="layout.translation" type="button"><svg viewBox="0 0 16 16"><rect x="2" y="5" width="12" height="2" rx="1"/><rect x="2" y="9" width="9" height="2" rx="1"/></svg></button>
        <button class="lay-opt" data-layout="stacked" data-i18n-title="layout.stacked" type="button"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="4" rx="1" opacity=".5"/><rect x="2" y="9" width="12" height="4" rx="1"/></svg></button>
        <button class="lay-opt" data-layout="columns" data-i18n-title="layout.columns" type="button"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="5" height="10" rx="1" opacity=".5"/><rect x="9" y="3" width="5" height="10" rx="1"/></svg></button>
      </div>
    </div>
  </section>

  <!-- Thanh điều khiển -->
  <section class="controls">
    <div class="row toolbar">
      <div class="dd">
        <button id="target-btn" class="pick-btn" data-i18n-title="settings.targetLang" type="button"></button>
        <div id="target-menu" class="menu hidden"></div>
      </div>
      <div class="dd">
        <button id="voice-btn" class="pick-btn" data-i18n-title="voice.title" type="button">🔊</button>
        <div id="voice-menu" class="menu hidden"></div>
      </div>
      <span class="spacer"></span>
      <button id="start" class="primary">▶</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <!-- Danh sách caption -->
  <main id="list" class="list" aria-live="polite"></main>

  <div id="v-resizer" class="v-resizer hidden" title="↕"></div>

  <!-- Tóm tắt -->
  <section id="summary-wrap" class="summary-wrap hidden">
    <div class="summary-bar">
      <strong data-i18n="summary.title">Tóm tắt</strong>
      <button id="sum-edit" class="mini" data-i18n-title="summary.editTitle" type="button">✏️</button>
      <span class="spacer"></span>
      <button id="sum-full" class="mini" data-i18n="summary.full" data-i18n-title="summary.fullTitle" type="button">📊</button>
      <button id="sum-dlhtml" class="mini hidden" data-i18n-title="summary.dlHtmlTitle" type="button">⬇ HTML</button>
      <button id="sum-export" class="mini" data-i18n-title="summary.exportTitle" type="button">⬇ MD</button>
    </div>
    <div id="sum-edit-box" class="sum-edit-box hidden">
      <textarea id="summary-extra" rows="3" data-i18n-ph="summary.extraPh" placeholder="VD: tập trung vào quyết định & deadline"></textarea>
      <div class="row-end"><button id="sum-extra-save" class="mini primary-mini" data-i18n="summary.save" type="button">Lưu</button></div>
    </div>
    <div id="summary" class="summary-body"></div>
    <div id="sum-spin" class="sum-spin hidden"><span class="spin"></span><span data-i18n="summary.updating">Đang cập nhật tóm tắt…</span></div>
  </section>

  <!-- Footer -->
  <footer class="bottom">
    <span class="count" id="count">0</span>
    <span class="spacer"></span>
    <button id="autoscroll" class="mini active" data-i18n="footer.auto" data-i18n-title="footer.autoTitle" type="button">↓ Auto</button>
    <button id="summary-toggle" class="mini" data-i18n="footer.summary" type="button">📋 Tóm tắt</button>
    <button id="export" class="mini" data-i18n-title="footer.exportTitle" type="button">💾</button>
    <button id="clear" class="mini" data-i18n-title="footer.clearTitle" type="button">🗑</button>
  </footer>
  <a id="dl" hidden></a>

  <script type="module" src="app.js"></script>
</body>
</html>
