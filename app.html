      if (code === 'auto') return '<span class="fl auto">🌐</span>';
      return '<span class="fl">' + (FLAGS[code] || '') + '</span>';
    }
    function setFlagActive(el, code) {
      if (!el) return;
      el.querySelectorAll('.flag-btn').forEach(b => b.classList.toggle('active', b.dataset.code === code));
    }
    function buildFlagRow(el, order, onPick) {
      if (!el) return;
      el.innerHTML = order.map(code => {
        const name = code === 'auto' ? 'Auto' : (LANG_NAME[code] || code);
        return `<button type="button" class="flag-btn" data-code="${code}" title="${name}">${flagInner(code)}<span class="fl-name">${name}</span></button>`;
      }).join('');
      el.addEventListener('click', (e) => {
        const b = e.target.closest('.flag-btn');
        if (!b || !el.contains(b)) return;
        setFlagActive(el, b.dataset.code);
        onPick(b.dataset.code);
      });
    }
    const uilangRow = document.getElementById('uilang-row');
    buildFlagRow(uilangRow, LANG_FLAG_ORDER, (code) => { applyI18n(code); api.saveSettings({ uiLang: code }); });

    // ── Quick language selector cạnh nút ▶: NGUỒN → ĐÍCH (cờ; bấm cờ mở popup chọn nước). Ép chọn thủ công. ──
    const lqSrc    = document.getElementById('lq-src');
    const lqTgt    = document.getElementById('lq-tgt');
    const lqSrcPop = document.getElementById('lq-src-pop');
    const lqTgtPop = document.getElementById('lq-tgt-pop');
    function setQuickFlag(btn, code) { if (btn) btn.innerHTML = flagInner(code); }
    // Source: ép chọn tay (system/mic) → lưu srcLang (main feed thẳng vào Whisper). Teams thì auto (disable).
    buildFlagRow(lqSrcPop, LANG_FLAG_ORDER, (code) => {
      _srcLang = code; setQuickFlag(lqSrc, code); lqSrcPop.classList.remove('open'); api.saveSettings({ srcLang: code }); refreshTtsBtn();
    });
    buildFlagRow(lqTgtPop, LANG_FLAG_ORDER, (code) => {

    // Phát PCM nối tiếp (FIFO) — synth ở main, phát ở renderer qua AudioContext riêng (tách context thu 16k).
    function ttsPlayPcm(samples, sampleRate) {
      return new Promise((resolve) => {
        let done = false;
        const finish = () => { if (done) return; done = true; if (_ttsResolvePlay === finish) _ttsResolvePlay = null; resolve(); };
        _ttsResolvePlay = finish;   // để ttsStop ép resolve (chống pump kẹt nếu onended không bắn)
        try {
          if (!_ttsPlayCtx || _ttsPlayCtx.state === 'closed')
            _ttsPlayCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (_ttsPlayCtx.state === 'suspended') { _ttsPlayCtx.resume().catch(() => {}); }
          const f32 = (samples instanceof Float32Array) ? samples : new Float32Array(samples);
          const buf = _ttsPlayCtx.createBuffer(1, f32.length, sampleRate);
          buf.getChannelData(0).set(f32);
          const node = _ttsPlayCtx.createBufferSource();
          node.buffer = buf; node.connect(_ttsPlayCtx.destination);
          _ttsCurSrc = node;
          _ttsCurEnd = _ttsPlayCtx.currentTime + buf.duration;   // M1: mốc kết thúc clip đang phát (tính pending)
          node.onended = () => { if (_ttsCurSrc === node) { _ttsCurSrc = null; _ttsCurEnd = null; } finish(); };
          node.start(0);
        } catch (e) { finish(); }
      });
    }
    async function ttsPump() {
      if (_ttsBusy) return;
      _ttsBusy = true;
      try {
        while (_ttsOn && _ttsQueue.length) {
          const text = _ttsQueue.shift();
          let res = null;
          try { res = await api.ttsSpeak(text); } catch (e) { res = null; }
          if (!_ttsOn) break;
          if (!res || !res.samples || !res.samples.length) continue;
          if (lqTts) lqTts.classList.add('speaking');
          await ttsPlayPcm(res.samples, res.sampleRate);
          if (lqTts && !_ttsQueue.length) lqTts.classList.remove('speaking');
          if (_ttsOn && _ttsQueue.length) await new Promise(r => setTimeout(r, 160));  // nghỉ ngắn giữa 2 câu → đỡ dính liền
        }
      } finally { _ttsBusy = false; if (lqTts) lqTts.classList.remove('speaking'); }
    }
    function ttsStop() {
      _ttsQueue = [];
      try { if (_ttsCurSrc) { _ttsCurSrc.onended = null; _ttsCurSrc.stop(); } } catch (e) {}
      _ttsCurSrc = null; _ttsCurEnd = null;
      if (_ttsResolvePlay) _ttsResolvePlay();   // ép resolve promise ttsPlayPcm đang chờ → pump thoát await, _ttsBusy nhả (FIX: trước n:set onended=null làm promise treo vĩnh viễn → đổi giọng/tắt-bật là chết)
      if (lqTts) lqTts.classList.remove('speaking');
    }
    // Tổng audio CHỜ phát (giây) = phần còn lại của clip đang phát + ước lượng mọi câu trong hàng đợi.
    function _ttsPendingSec() {
      let s = 0;
      if (_ttsCurSrc && _ttsCurEnd != null && _ttsPlayCtx) s += Math.max(0, _ttsCurEnd - _ttsPlayCtx.currentTime);
      for (const t of _ttsQueue) s += _ttsEstSec(t);
      return s;
    }
    // M2: tách câu DÀI theo dấu câu/mệnh đề (gom tới ≲_TTS_SPLIT_CHARS) → đọc sớm + drop-oldest theo hạt mịn.
    function _ttsSplit(text) {
      const raw = text.split(/(?<=[,.;:!?])\s+/);
      const out = []; let cur = '';
      for (const seg of raw) {
        if (cur && (cur + ' ' + seg).length > _TTS_SPLIT_CHARS) { out.push(cur.trim()); cur = seg; }
        else cur = cur ? cur + ' ' + seg : seg;
      }
      if (cur.trim()) out.push(cur.trim());
      return out.length ? out : [text];
    }
    function ttsEnqueue(id, text) {
      if (!_ttsOn || !text) return;
      if (id != null) { if (_ttsSpoken.has(id)) return; _ttsSpoken.add(id); }
      // M2: câu dài → tách (budget không bị 1 blob dài phá; bắt đầu đọc mệnh đề đầu sớm hơn).
      for (const p of (text.length > _TTS_SPLIT_CHARS ? _ttsSplit(text) : [text])) _ttsQueue.push(p);
      // M1: vượt trần cứng → chỉ giữ câu MỚI nhất; còn lại bỏ câu CŨ nhất (chưa đọc) tới khi tổng ≤ budget.
      if (_ttsPendingSec() > _TTS_HARD_S) _ttsQueue.splice(0, _ttsQueue.length - 1);
      else while (_ttsQueue.length > 1 && _ttsPendingSec() > _TTS_BUDGET_S) _ttsQueue.shift();
      if (_ttsSpoken.size > 1000) { const it = _ttsSpoken.values(); for (let i = 0; i < 300; i++) _ttsSpoken.delete(it.next().value); }
      ttsPump();
    }

    // ── Audio capture (System Audio / Microphone) → PCM float32 @16k cho STT ──
    // Dùng Web Audio (AudioContext 16k + ScriptProcessor) lấy PCM mono trực tiếp → KHÔNG MediaRecorder/WebM,
    // nên phía main (sherpa-onnx-node) KHÔNG cần Python/PyAV/ffmpeg để decode.
    let _recordingActive = false;
    let _audioCtx = null, _srcNode = null, _procNode = null, _zeroGain = null;
    let _lastPcmTs = 0, _audioWatchdog = null;   // tự-lành: phát hiện onaudioprocess ngừng bắn → resume ctx

    async function startAudioCapture(source) {
      try {
        let stream;
        if (source === 'mic') {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        } else {
          stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: { width: 320, height: 240, frameRate: 1 } });
        }
        _rawStream = stream;
        stream.getVideoTracks().forEach(t => t.stop());
        const audioTracks = stream.getAudioTracks();
        _audioStream = new MediaStream(audioTracks);
        if (!audioTracks.length) { statusMsg.textContent = '⚠ Không có audio track — thử lại'; return; }

        _recordingActive = true;

        const Ctx = window.AudioContext || window.webkitAudioContext;
        _audioCtx = new Ctx({ sampleRate: 16000 });               // tự resample stream về 16k
        if (_audioCtx.state === 'suspended') { try { await _audioCtx.resume(); } catch (e) {} }
        // TỰ-LÀNH: nếu AudioContext bị suspend giữa chừng (vd tua/đổi thiết bị audio) → onaudioprocess NGỪNG bắn
        // → STT chết thầm lặng (phải ⏹▶). resume() ngay khi rời 'running' (không re-prompt) để PCM chảy lại.
        _audioCtx.onstatechange = () => {
          if (_recordingActive && _audioCtx && _audioCtx.state !== 'running') { _audioCtx.resume().catch(() => {}); }
        };
        _srcNode = _audioCtx.createMediaStreamSource(_audioStream);
        _procNode = _audioCtx.createScriptProcessor(4096, 1, 1);
        _zeroGain = _audioCtx.createGain(); _zeroGain.gain.value = 0;   // gain 0: không vọng ra loa
        _procNode.onaudioprocess = (e) => {
          if (!_recordingActive) return;
          // Gửi KHUNG NHỎ (~256ms, 4096 mẫu) thay vì gom 2.5s → VAD ở main tự ghép thành câu trọn,
          // cắt theo khoảng lặng (không cắt mù giữa câu). Độ trễ thấp + endpoint chính xác.
          _lastPcmTs = Date.now();   // nhịp tim cho watchdog (ScriptProcessor bắn đều ~256ms kể cả khi im lặng)
          const ch = e.inputBuffer.getChannelData(0);   // mono float32 @ 16k
          api.sendAudioPcm(new Float32Array(ch).buffer);
        };
        // Watchdog: nếu >3s không có khung PCM nào (ctx kẹt/suspend ngầm sau tua/đổi thiết bị) → resume (an toàn,
        // KHÔNG re-prompt). Bổ trợ onstatechange cho ca state không đổi mà onaudioprocess vẫn ngừng.
        _lastPcmTs = Date.now();
        clearInterval(_audioWatchdog);
        _audioWatchdog = setInterval(() => {
          if (_recordingActive && _audioCtx && Date.now() - _lastPcmTs > 3000) {
            console.warn('[audio] PCM ngừng >3s → resume AudioContext');
            _audioCtx.resume().catch(() => {});
          }
        }, 2000);
        _srcNode.connect(_procNode);
        _procNode.connect(_zeroGain);
        _zeroGain.connect(_audioCtx.destination);   // ScriptProcessor cần ở trong graph tới destination
        console.log('[audio] Web Audio PCM @16k | ctx rate =', _audioCtx.sampleRate);
      } catch (err) {
        _recordingActive = false;
        console.error('[audio]', err);
        const msg = err.name === 'NotAllowedError' ? 'Quyền bị từ chối' :
                    err.name === 'NotFoundError'    ? 'Không tìm thấy thiết bị âm thanh' :
                    err.name === 'AbortError'       ? 'Đã hủy' :
                    (err.message || err.name || 'Lỗi không xác định');
        statusMsg.textContent = '❌ Thu âm thất bại: ' + msg;
      }
    }

    function stopAudioCapture() {
      _recordingActive = false;
      clearInterval(_audioWatchdog); _audioWatchdog = null;
      try { if (_procNode) { _procNode.onaudioprocess = null; _procNode.disconnect(); } } catch (e) {}
      try { if (_srcNode) _srcNode.disconnect(); } catch (e) {}
      try { if (_zeroGain) _zeroGain.disconnect(); } catch (e) {}
      try { if (_audioCtx) _audioCtx.close(); } catch (e) {}
      _procNode = _srcNode = _zeroGain = _audioCtx = null;
      _audioStream?.getTracks().forEach(t => t.stop());
      _rawStream?.getTracks().forEach(t => t.stop());
      _audioStream = null;
      _rawStream = null;
    }

    api.onStartAudioCapture(({ source }) => startAudioCapture(source));
    api.onStopAudioCapture(() => stopAudioCapture());

    async function doExport(mode) {

      const header = `=== ${TITLE[mode] || TITLE.orig} cuộc họp — ${new Date().toLocaleString('vi-VN')} ===\n` +
                     `Tổng số dòng: ${sorted.length}\n` +
                     `${'='.repeat(60)}\n\n`;
      let lines;
      if (mode === 'trans')     lines = sorted.map(c => `[${c.ts || ''}] ${c.author || 'Unknown'}: ${c.translated || ''}`).join('\n');
      else if (mode === 'both') lines = sorted.map(c => `[${c.ts || ''}] ${c.author || 'Unknown'}:\n  • ${c.original || ''}\n  → ${c.translated || ''}`).join('\n\n');
      else                      lines = sorted.map(c => `[${c.ts || ''}] ${c.author || 'Unknown'}: ${c.original || ''}`).join('\n');
      const content = header + lines + '\n';
      const date = new Date().toISOString().slice(0, 10);
      const r = await api.exportSummary({ markdown: content, defaultName: `${NAME[mode] || NAME.orig}-${date}.txt` });
      if (r.ok) {
        statusMsg.textContent = t('status.exported', { n: sorted.length, path: r.filePath });
        setTimeout(() => { statusMsg.textContent = ''; }, 4000);
      }
    }

    // ── Summary modal ──
    const summaryModal   = document.getElementById('summary-modal');
    const sumBody        = document.getElementById('sum-body');

    const sumGenerateBtn = document.getElementById('sum-generate-btn');
    const sumExportBtn   = document.getElementById('sum-export-btn');

    let _lastMarkdown    = '';

    // Markdown → HTML renderer (line-based): hỗ trợ heading, list, bảng GFM, hr, inline.
    function md2html(md) {
      const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const inline = s => escHtml(s)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,     '<em>$1</em>')
        .replace(/`(.+?)`/g,       '<code>$1</code>');
      const isSep = s => /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(s);
      const cells = r => r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());

      const lines = (md || '').replace(/\r\n/g,'\n').split('\n');
      const out = [];
      let i = 0, listType = null, para = [];
      const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };
      const flushPara = () => { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };

      while (i < lines.length) {
        const t = lines[i].trim();
        if (t === '') { flushPara(); closeList(); i++; continue; }

        // Bảng: dòng có "|" + dòng kế là dòng phân cách "---"
        if (/\|/.test(t) && i + 1 < lines.length && isSep(lines[i + 1])) {
          flushPara(); closeList();
          const head = cells(lines[i]); i += 2;
          let html = '<table><thead><tr>' + head.map(h => `<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>';
          while (i < lines.length && lines[i].trim() !== '' && /\|/.test(lines[i])) {
            html += '<tr>' + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>'; i++;
          }
          out.push(html + '</tbody></table>'); continue;
        }
        let m;
        const _h = t.replace(/^\*\*(.+?)\*\*$/, '$1');   // gỡ bold bọc cả dòng (ChatGPT hay in đậm dòng tiêu đề → **## ...**)
        if ((m = _h.match(/^(#{1,6})\s*(.+)$/))) { flushPara(); closeList(); const l = Math.min(m[1].length, 4); out.push(`<h${l}>${inline(m[2])}</h${l}>`); i++; continue; }
        if (/^---+$/.test(t)) { flushPara(); closeList(); out.push('<hr>'); i++; continue; }
        if ((m = t.match(/^[*\-]\s+(.+)$/))) { flushPara(); if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); i++; continue; }
        if ((m = t.match(/^\d+\.\s+(.+)$/))) { flushPara(); if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); i++; continue; }
        closeList(); para.push(inline(t)); i++;
      }
      flushPara(); closeList();
      return out.join('');
    }

    document.getElementById('sum-btn').addEventListener('click', () => {
      summaryModal.classList.add('open');
    });
    document.getElementById('sum-close-btn').addEventListener('click', () => {
      summaryModal.classList.remove('open');
    });
    // (Bỏ đóng khi click nền: popup chỉ đóng bằng nút ✕)

    sumGenerateBtn.addEventListener('click', async () => {
      if (!captionData.size) {
        sumStatus.textContent = t('summary.noContent');
        return;
      }
      sumGenerateBtn.disabled = true;
      sumGenerateBtn.innerHTML = '<span class="m3-spinner-sm"></span> ' + t('summary.generate');
      sumStatus.textContent = t('summary.processing', { n: captionData.size });
      sumExportBtn.disabled = true;
      sumCopyBtn.disabled = true;
      sumBody.innerHTML = '<div class="summary-loading"><div class="m3-spinner-lg"></div>' + t('summary.generating') + '</div>';

      const captions = [...captionData.values()];
      const result = await api.summarizeMeeting(captions);

      sumGenerateBtn.disabled = false;
      sumGenerateBtn.innerHTML = '✨ <span data-i18n="summary.generate">' + t('summary.generate') + '</span>';

      if (!result.ok) {
        sumStatus.textContent = '❌ ' + result.error;
        sumBody.innerHTML = `<div style="color:#f88;padding:20px;text-align:center">${esc(result.error)}</div>`;
        return;
      }

      _lastMarkdown = result.markdown;
      sumBody.innerHTML = md2html(result.markdown);

      // Hiển thị stats
      if (result.stats) {
        const s = result.stats;
        const fmtTime = sec => sec >= 60 ? `${Math.floor(sec/60)}m${sec%60}s` : `${sec}s`;
        const parts = [
          s.durationMin > 0 ? `⏱ Meeting: ${s.durationMin}p` : null,
          `🤖 ${s.provider}/${s.model}`,
          `📥 ${s.inputTokens.toLocaleString()} tok`,
          `📤 ${s.outputTokens.toLocaleString()} tok`,
          `⌛ ${fmtTime(s.elapsedSec)}`,
        ].filter(Boolean);
        sumStatus.innerHTML = '✅ ' + parts.join(' · ');
      } else {
        sumStatus.textContent = '✅ ' + t('summary.done');
      }
      sumExportBtn.disabled = false;
      sumCopyBtn.disabled = false;
    });

    sumExportBtn.addEventListener('click', async () => {
      if (!_lastMarkdown) return;
      const date = new Date().toISOString().slice(0,10);
      const result = await api.exportSummary({ markdown: _lastMarkdown, defaultName: `meeting-${date}.md` });
      if (result.ok) sumStatus.textContent = `✅ Đã lưu: ${result.filePath}`;
    });

    sumCopyBtn.addEventListener('click', async () => {
      if (!_lastMarkdown) return;
      let ok = false;
      // Ưu tiên clipboard native của Electron (qua IPC) — đáng tin hơn navigator.clipboard
      try { const r = await api.copyToClipboard(_lastMarkdown); ok = !!(r && r.ok); } catch {}
      // Fallback Web Clipboard API nếu IPC không có/thất bại
      if (!ok) { try { await navigator.clipboard.writeText(_lastMarkdown); ok = true; } catch {} }
      sumCopyBtn.textContent = ok ? '✔ Đã copy' : '❌ Lỗi copy';
      setTimeout(() => { sumCopyBtn.textContent = '⎘ Copy'; }, 1500);
    });
    // ── end Summary modal ──

    // Tắt auto-scroll khi user cuộn lên — throttle bằng rAF (scroll fire hàng chục lần/cử chỉ;
    // mỗi lần đọc scrollHeight/scrollTop/clientHeight là 1 layout read).
    let _schPending = false;
    listEl.addEventListener('scroll', () => {
      if (_schPending) return;
      _schPending = true;
      requestAnimationFrame(() => {
        _schPending = false;
        const atBottom = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 60;
        if (!atBottom && autoScroll) {
          autoScroll = false;
          scrollBtn.classList.remove('active');
        }
      });
    });

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
