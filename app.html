<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Caption Translator</title>
  <style>
    /* ============================================================
       FINAL — "Google Material 3 minimal" dark overlay
       Direction C (winner) + grafts from A (focus rigor, elevation
       tokens) and B (radial canvas, card top-light, live accent
       strip, modal shadow-pop, single hero gradient, motion tokens).
       Drop-in replacement for the <style> inner content.
       Tonal surfaces · state-layer hovers · 8/12/16 radii ·
       one restrained blue accent · quick physical 150-200ms motion.
       NOTE: every interactive element gets a 2px focus-visible ring;
       the blue->violet gradient is used ONLY on the two primary
       buttons (.btn-save, #sum-generate-btn) and never on the
       always-visible status dot or live-caption strip.
       ============================================================ */
    :root {
      /* tonal neutral ramp */
      --m3-bg:        #131314;   /* window base                       */
      --m3-surf:      #1e1f20;   /* default surface (status/footer)   */
      --m3-surf-1:    #232425;   /* slightly raised (entries/list bg) */
      --m3-surf-2:    #28292a;   /* raised (header, modal)            */
      --m3-surf-3:    #303133;   /* controls / inputs                 */
      --m3-surf-4:    #3a3b3d;   /* control hover settle              */
      --m3-line:      rgba(255,255,255,.07);  /* hairline outline     */
      --m3-line-2:    rgba(255,255,255,.11);

      /* near-black canvas with a faint radial top-light (graft: B) */
      --m3-canvas:    radial-gradient(120% 90% at 50% -10%, #1a1b1d 0%, #131314 58%);
      /* subtle top-light sheen for raised cards (graft: B) */
      --m3-sheen:     linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,0) 44%);

      /* state-layer overlays (M3 interaction model) */
      --m3-hover:     rgba(255,255,255,.06);
      --m3-press:     rgba(255,255,255,.11);
      --m3-hover-on:  rgba(138,180,248,.12); /* hover over accent      */

      /* one restrained accent */
      --m3-accent:    #8ab4f8;            /* primary (blue on dark)    */
      --m3-accent-d:  #aecbfa;
      --m3-accent-ctr:#2d3c54;            /* primary container         */
      --m3-accent-on: #d7e3f8;            /* text on container         */
      /* ONE hero gradient — primary affordances only (graft: B, restrained) */
      --m3-grad:      linear-gradient(135deg, #2b6fe0 0%, #5a6bf0 60%, #7b6bf2 100%);
      --m3-grad-h:    linear-gradient(135deg, #3b7ef0 0%, #6a7bff 60%, #8b7bff 100%);

      /* semantic (kept calm — softest variants of the three) */
      --m3-ok:        #6dd3b3;
      --m3-ok-ctr:    #173a31;
      --m3-warn:      #f2c97d;
      --m3-err:       #f2b8b5;
      --m3-err-ctr:   #3a1f1d;

      /* text ramp — tăng tương phản (sáng hơn) */
      --m3-on:        #f2f2f2;  /* high emphasis  */
      --m3-on-2:      #dadcdb;  /* medium         */
      --m3-on-3:      #b6bcc1;  /* low / labels    */
      --m3-on-4:      #888d92;  /* disabled / faint*/

      /* elevation tokens (graft: A — two tiers for this small window) */
      --m3-e1:        0 1px 2px rgba(0,0,0,.40), 0 1px 3px 1px rgba(0,0,0,.26);
      --m3-e2:        0 6px 18px rgba(0,0,0,.46), 0 2px 6px rgba(0,0,0,.30);
      --m3-pop:       0 24px 60px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.40);
      /* back-compat aliases for original names */
      --m3-shadow-1:  var(--m3-e1);
      --m3-shadow-3:  var(--m3-pop);

      /* focus ring token (graft: A 2px width + B higher-alpha values) */
      --m3-ring-edge: rgba(138,180,248,.85);
      --m3-ring-glow: rgba(138,180,248,.32);

      /* motion — M3 emphasized decelerate, quick & physical */
      --m3-ease:      cubic-bezier(.2,0,0,1);
      --m3-dur:       .16s;
      --m3-t:         .18s var(--m3-ease);  /* tidy single token (graft: B) */

      --m3-font: "Roboto", "Inter", system-ui, "Segoe UI", -apple-system,
                 BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --m3-mono: "Roboto Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    *::selection { background: rgba(138,180,248,.30); color: #fff; }

    body {
      font-family: var(--m3-font);
      background: var(--m3-bg);
      background-image: var(--m3-canvas);
      color: var(--m3-on);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      font-size: 13px;
      letter-spacing: .1px;
      accent-color: var(--m3-accent);
    }

    /* Universal focus ring — keyboard focus only, on EVERY interactive
       element (graft: A coverage + B alpha). 2px solid edge + soft glow. */
    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--m3-ring-edge), 0 0 0 5px var(--m3-ring-glow);
    }

    /* ── Header (top app bar) ── */
    .header {
      background: var(--m3-sheen), var(--m3-surf-2);
      padding: 10px 12px 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--m3-line);
      flex-shrink: 0;
      box-shadow: var(--m3-e1);
      z-index: 5;
      -webkit-app-region: drag;
    }
    .header > span:first-child { line-height: 1; }
    .header-title {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .1px;
      color: var(--m3-on);
      flex: 1;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    /* ── Base controls (tonal, state-layer hover) ──
       Hover via background-image overlay so any inline background-color
       still shows the state-layer through it (graft: A safety net). */
    select, button {
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: .1px;
      line-height: 1.2;
      border-radius: 8px;
      border: 1px solid transparent;
      background-color: var(--m3-surf-3);
      background-image: linear-gradient(transparent, transparent);
      color: var(--m3-on-2);
      cursor: pointer;
      padding: 6px 12px;
      outline: none;
      position: relative;
      transition: background-color var(--m3-t),
                  background-image var(--m3-t),
                  color var(--m3-t),
                  border-color var(--m3-t),
                  box-shadow var(--m3-t),
                  transform var(--m3-dur) var(--m3-ease);
    }
    select:hover,
    button:hover {
      background-color: var(--m3-surf-4);
      background-image: linear-gradient(var(--m3-hover), var(--m3-hover));
      color: var(--m3-on);
    }
    button:active {
      background-image: linear-gradient(var(--m3-press), var(--m3-press));
      transform: translateY(.5px) scale(.985);
    }
    button.active {
      background-color: var(--m3-accent-ctr);
      border-color: transparent;
      color: var(--m3-accent-on);
    }
    button.active:hover { background-color: #344768; }
    button:disabled { opacity: .45; cursor: default; }

    /* select dropdown — restyle native chevron */
    select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 26px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--m3-on-3) 50%),
        linear-gradient(135deg, var(--m3-on-3) 50%, transparent 50%);
      background-position:
        calc(100% - 14px) 50%,
        calc(100% - 9px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    select:hover {
      background-image:
        linear-gradient(45deg, transparent 50%, var(--m3-accent) 50%),
        linear-gradient(135deg, var(--m3-accent) 50%, transparent 50%);
    }
    select option { background: var(--m3-surf-2); color: var(--m3-on); }

    /* header icon buttons (settings / pin) */
    #menu-btn, #pin-btn { color: var(--m3-on-2); }
    /* Pin: TẮT = xám (desaturate emoji), BẬT = đỏ (màu gốc); KHÔNG nền khi active */
    #pin-btn { filter: grayscale(1); opacity: .55; }
    #pin-btn.active { filter: none; opacity: 1; background: transparent; }

    /* ── Status bar ── */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      font-size: 11.5px;
      letter-spacing: .15px;
      color: var(--m3-on-3);
      background: var(--m3-surf);
      border-bottom: 1px solid var(--m3-line);
      flex-shrink: 0;
    }
    #status-msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--m3-on-4);
      flex-shrink: 0;
      transition: background .3s var(--m3-ease), box-shadow .3s var(--m3-ease);
    }
    .status.connecting   .dot,
    .status.waiting      .dot,
    .status.loading      .dot,
    .status.waiting-captions .dot {
      background: var(--m3-warn);
      box-shadow: 0 0 0 3px rgba(242,201,125,.16);
      animation: blink 1.2s infinite;
    }
    .status.running .dot {
      background: var(--m3-ok);
      box-shadow: 0 0 0 3px rgba(109,211,179,.18);
    }
    .status.error .dot {
      background: var(--m3-err);
      box-shadow: 0 0 0 3px rgba(242,184,181,.16);
    }
    .status.ended .dot { background: var(--m3-on-4); }

    /* ── CC toggle + export-orig (small tonal buttons in status) ── */
    #cc-btn {
      margin-left: auto;
      font-size: 11.5px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--m3-surf-3);
      color: var(--m3-on-3);
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--m3-t), color var(--m3-t),
                  border-color var(--m3-t), box-shadow var(--m3-t),
                  transform var(--m3-dur) var(--m3-ease);
    }
    #cc-btn:hover { background: var(--m3-surf-4); color: var(--m3-on); }
    #cc-btn:active { transform: translateY(.5px) scale(.985); }
    #cc-btn.active {
      background: var(--m3-ok-ctr);
      border-color: transparent;
      color: var(--m3-ok);
    }
    #cc-btn.loading {
      opacity: .6;
      pointer-events: none;
      animation: blink .8s infinite;
    }

    /* ── Modal scrim + dialog ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(8,9,11,.62);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: scrimIn var(--m3-dur) var(--m3-ease);
    }
    .modal-overlay.open { display: flex; }
    @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }

    /* Busy overlay — phủ TOÀN trang (trên cả modal, z-index cao nhất), bắt mọi click để chặn thao tác khi tải model */
    .busy-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(8,9,11,.74);
      backdrop-filter: blur(2px);
      z-index: 9999;
      align-items: center; justify-content: center;
      cursor: progress;
      -webkit-app-region: no-drag;        /* không cho kéo cửa sổ qua overlay */
      animation: scrimIn var(--m3-dur) var(--m3-ease);
    }
    .busy-overlay.open { display: flex; }
    .busy-box { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 28px 36px; }
    .busy-spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid var(--m3-surf-4, #3a3b3c);
      border-top-color: var(--m3-accent, #7ca8ff);
      animation: busySpin .8s linear infinite;
    }
    @keyframes busySpin { to { transform: rotate(360deg); } }
    .busy-text { font-size: 13px; color: var(--m3-on-1, #e3e3e3); font-weight: 600; letter-spacing: .3px; text-align: center; }

    .modal {
      background: var(--m3-sheen), var(--m3-surf-2);
      border: 1px solid var(--m3-line);
      border-radius: 16px;
      padding: 22px 22px 20px;
      width: 340px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      box-shadow: var(--m3-pop);
      -webkit-app-region: no-drag;
      animation: dialogIn .19s var(--m3-ease);
    }
    .modal::-webkit-scrollbar { width: 8px; }
    .modal::-webkit-scrollbar-thumb { background: var(--m3-surf-4); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
    .modal::-webkit-scrollbar-track { background: transparent; }
    @keyframes dialogIn {
      from { opacity: 0; transform: translateY(8px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    .modal h3 {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: .1px;
      color: var(--m3-on);
      margin-bottom: 16px;
    }
    .modal label {
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: .3px;
      color: var(--m3-on-3);
      margin-bottom: 6px;
    }
    .modal input[type="password"],
    .modal input[type="text"],
    /* inline-styled inputs/selects in the modal — unify */
    #s-apikey,
    #s-provider,
    #s-capture,
    #s-mic-device,
    #s-process {
      width: 100%;
      padding: 9px 11px !important;
      font-size: 12.5px !important;
      background: var(--m3-surf-3) !important;
      border: 1px solid var(--m3-line-2) !important;
      border-radius: 8px !important;
      color: var(--m3-on) !important;
      outline: none;
      transition: border-color var(--m3-t),
                  box-shadow var(--m3-t),
                  background var(--m3-t);
    }
    .modal input[type="password"],
    .modal input[type="text"],
    #s-apikey { font-family: var(--m3-mono); }
    .modal input::placeholder { color: var(--m3-on-4); }
    .modal input:hover,
    #s-provider:hover, #s-capture:hover, #s-mic-device:hover, #s-process:hover { background: var(--m3-surf-4) !important; }
    /* Khôi phục chevron ▾ cho select trong modal (bị 'background' shorthand !important ở trên xoá background-image) */
    #s-provider, #s-capture, #s-mic-device, #s-process,
    #s-provider:hover, #s-capture:hover, #s-mic-device:hover, #s-process:hover {
      background-image:
        linear-gradient(45deg, transparent 50%, var(--m3-on-3) 50%),
        linear-gradient(135deg, var(--m3-on-3) 50%, transparent 50%) !important;
      background-position: calc(100% - 16px) 53%, calc(100% - 11px) 53% !important;
      background-size: 5px 5px, 5px 5px !important;
      background-repeat: no-repeat !important;
      padding-right: 30px !important;
    }
    .modal input:focus,
    #s-apikey:focus,
    #s-provider:focus,
    #s-capture:focus,
    #s-mic-device:focus,
    #s-process:focus {
      border-color: var(--m3-accent) !important;
      box-shadow: 0 0 0 2px var(--m3-ring-edge), 0 0 0 5px var(--m3-ring-glow);
    }
    .modal .hint {
      font-size: 10.5px;
      line-height: 1.6;
      color: var(--m3-on-4);
      margin-top: 6px;
    }
    .modal .hint a, .modal .hint .ext-link { color: var(--m3-accent); text-decoration: none; }
    .modal .hint a:hover, .modal .hint .ext-link:hover { text-decoration: underline; }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 22px;
      justify-content: flex-end;
    }
    .modal-actions button {
      font-size: 12.5px;
      padding: 9px 18px;
      border-radius: 20px;        /* M3 pill text/filled buttons */
    }
    /* cancel = text/tonal button */
    #settings-cancel {
      background: transparent;
      color: var(--m3-accent);
      border-color: transparent;
    }
    #settings-cancel:hover { background: var(--m3-hover-on); color: var(--m3-accent-d); }
    /* save = the ONE hero gradient (primary affordance only) */
    .modal-actions .btn-save {
      background-image: var(--m3-grad);
      background-color: transparent;
      border-color: transparent;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(50,90,220,.30);
    }
    .modal-actions .btn-save:hover {
      background-image: var(--m3-grad-h);
      color: #fff;
      box-shadow: 0 4px 16px rgba(70,110,240,.42);
    }
    .modal-actions .btn-save:active { transform: translateY(.5px) scale(.99); }

    /* show/hide key visibility toggle */
    #s-toggle-vis {
      flex-shrink: 0;
      padding: 6px 12px !important;
      font-size: 11.5px !important;
      border-radius: 8px !important;
      background: var(--m3-surf-3) !important;
      color: var(--m3-on-2) !important;
      border: 1px solid var(--m3-line-2) !important;
    }
    #s-toggle-vis:hover { background: var(--m3-surf-4) !important; color: var(--m3-on) !important; }

    /* ── Tabs ── */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--m3-line);
      margin-bottom: 18px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: .2px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--m3-on-3);
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      transition: color var(--m3-t),
                  border-color var(--m3-t),
                  background var(--m3-t);
    }
    .tab-btn:hover { color: var(--m3-on); background: var(--m3-hover); }
    .tab-btn.active { color: var(--m3-accent); border-bottom-color: var(--m3-accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: dialogIn .2s var(--m3-ease); }

    /* ── Window picker cards ── */
    .win-card {
      background: var(--m3-sheen), var(--m3-surf-1);
      border: 1px solid var(--m3-line);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--m3-e1);
      transition: border-color var(--m3-t),
                  background var(--m3-t),
                  box-shadow var(--m3-t),
                  transform var(--m3-dur) var(--m3-ease);
      display: flex;
      flex-direction: column;
    }
    .win-card:hover {
      border-color: var(--m3-line-2);
      box-shadow: var(--m3-e2);
      transform: translateY(-1px);
    }
    .win-card.selected {
      border-color: var(--m3-accent);
      background: var(--m3-accent-ctr);
      box-shadow: 0 0 0 1px var(--m3-accent), var(--m3-e2);
    }
    .win-card:focus-visible {
      box-shadow: 0 0 0 2px var(--m3-ring-edge), 0 0 0 5px var(--m3-ring-glow);
    }
    .win-card img.win-thumb {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      display: block;
      background: #0c0c0d;
    }
    .win-card .win-title {
      font-size: 10.5px;
      color: var(--m3-on-2);
      padding: 6px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .win-card.selected .win-title { color: var(--m3-accent-d); }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }

    /* ── Caption list ── */
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--m3-surf-4) transparent;
    }
    .list::-webkit-scrollbar { width: 8px; }
    .list::-webkit-scrollbar-thumb {
      background: var(--m3-surf-4);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    .list::-webkit-scrollbar-thumb:hover { background: #4a4b4d; background-clip: content-box; }
    .list::-webkit-scrollbar-track { background: transparent; }

    .empty {
      color: var(--m3-on-4);
      font-size: 12.5px;
      text-align: center;
      margin-top: 56px;
      line-height: 1.9;
    }
    .empty span { color: var(--m3-on-4) !important; }

    /* ── Caption entry (filled tonal card with subtle top-light) ── */
    .entry {
      position: relative;
      background: var(--m3-sheen), var(--m3-surf-1);
      border: 1px solid var(--m3-line);
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: var(--m3-e1);
      animation: fadeUp .18s var(--m3-ease);
      transition: border-color var(--m3-t), box-shadow var(--m3-t);
    }
    .entry:hover { border-color: var(--m3-line-2); box-shadow: var(--m3-e2); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .entry-meta {
      display: flex;
      align-items: baseline;
      margin-bottom: 5px;
    }
    .entry-author {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .15px;
      color: var(--m3-accent);
    }
    .entry-time {
      font-size: 10px;
      letter-spacing: .2px;
      color: var(--m3-on-4);
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }
    .entry-original {
      font-size: 12px;
      color: var(--m3-on-3);
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .entry-translated {
      font-size: 13.5px;
      color: var(--m3-on);
      line-height: 1.55;
      letter-spacing: .1px;
    }

    /* ── Live entry (currently being spoken) — FOCAL POINT ──
       Flat-blue left accent strip leads the eye to the translated line
       (graft: B mechanism, C's single blue, no gradient). */
    .entry.live {
      border-color: transparent;
      background: var(--m3-accent-ctr);
      box-shadow: 0 0 0 1px rgba(138,180,248,.30), var(--m3-e1);
    }
    .entry.live::before {
      content: "";
      position: absolute;
      left: 0; top: 9px; bottom: 9px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--m3-accent);
    }
    .entry.live .entry-author { color: var(--m3-accent-d); }
    .entry.live .entry-translated { color: var(--m3-accent-d); }
    .live-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--m3-ok);
      margin-left: 6px;
      vertical-align: middle;
      box-shadow: 0 0 0 3px rgba(109,211,179,.2);
      animation: blink 1s infinite;
    }

    /* ── Error banner ── */
    .error-banner {
      background: var(--m3-err-ctr);
      border: 1px solid rgba(242,184,181,.22);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 11.5px;
      color: var(--m3-err);
      line-height: 1.75;
      box-shadow: var(--m3-e1);
    }
    .error-banner b { color: #f6cecb; }
    .error-banner code {
      display: block;
      background: rgba(0,0,0,.32);
      padding: 7px 9px;
      border-radius: 8px;
      margin: 6px 0;
      font-size: 10px;
      font-family: var(--m3-mono);
      color: #f0c0a8;
      word-break: break-all;
      user-select: text;
    }
    /* Theme sáng: nền banner hồng nhạt → chữ phải đỏ đậm để nổi (tránh chìm vào nền) */
    :root[data-theme="light"] .error-banner   { color: #8c1d16; }
    :root[data-theme="light"] .error-banner b { color: #5e0f0a; }

    /* ── Hint banner (manual caption enable help) ── */
    .hint-banner {
      background: var(--m3-sheen), var(--m3-accent-ctr);
      border: 1px solid rgba(138,180,248,.2);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 11.5px;
      color: var(--m3-on-2);
      line-height: 2;
      box-shadow: var(--m3-e1);
    }
    .hint-banner b { color: var(--m3-accent-d); font-weight: 600; }
    .hint-banner kbd {
      display: inline-block;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--m3-line-2);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 1px 7px;
      font-size: 10px;
      font-family: var(--m3-mono);
      color: var(--m3-on);
      box-shadow: 0 1px 0 rgba(0,0,0,.3);
    }

    /* ── Footer (bottom action bar) ── */
    .footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--m3-surf);
      border-top: 1px solid var(--m3-line);
      box-shadow: 0 -1px 2px rgba(0,0,0,.22);
      flex-shrink: 0;
    }
    .footer button { font-size: 12px; padding: 6px 12px; }
    .footer-count {
      font-size: 11.5px;
      color: var(--m3-on-3);
      letter-spacing: .15px;
      font-variant-numeric: tabular-nums;
    }
    .spacer { flex: 1; }
    /* auto-scroll toggle uses generic .active accent-container already */

    /* ── Summary modal ── */
    .summary-body {
      flex: 1;
      overflow-y: auto;
      background: var(--m3-surf-1);
      border: 1px solid var(--m3-line);
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--m3-on-2);
      white-space: normal;
      word-break: break-word;
      user-select: text;
      min-height: 200px;
      scrollbar-width: thin;
      scrollbar-color: var(--m3-surf-4) transparent;
    }
    .summary-body::-webkit-scrollbar { width: 8px; }
    .summary-body::-webkit-scrollbar-thumb {
      background: var(--m3-surf-4); border-radius: 8px;
      border: 2px solid transparent; background-clip: content-box;
    }
    .summary-body::-webkit-scrollbar-track { background: transparent; }
    .summary-body h1, .summary-body h2, .summary-body h3, .summary-body h4 {
      color: var(--m3-accent-d);
      margin: 16px 0 6px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: .1px;
    }
    .summary-body h1 { font-size: 17px; }
    .summary-body h2 {
      font-size: 14.5px;
      color: var(--m3-accent);
      padding-bottom: 4px;
      border-bottom: 1px solid var(--m3-line);
    }
    .summary-body h3 { font-size: 13px; }
    .summary-body h4 { font-size: 12.5px; font-weight: 600; color: var(--m3-on); }
    .summary-body p { margin: 7px 0; }
    .summary-body ul, .summary-body ol { padding-left: 22px; margin: 7px 0; }
    .summary-body ul { list-style: disc; }
    .summary-body ol { list-style: decimal; }
    .summary-body li { margin: 3px 0; }
    .summary-body li::marker { color: var(--m3-on-4); }
    .summary-body strong { color: var(--m3-warn); font-weight: 600; }
    .summary-body em { color: var(--m3-accent-d); font-style: italic; }
    .summary-body a { color: var(--m3-accent); text-decoration: none; }
    .summary-body a:hover { text-decoration: underline; }
    .summary-body code {
      background: rgba(138,180,248,.12);
      border-radius: 6px;
      padding: 1px 5px;
      font-family: var(--m3-mono);
      font-size: 11px;
      color: var(--m3-accent-d);
    }
    .summary-body hr { border: none; border-top: 1px solid var(--m3-line); margin: 14px 0; }
    .summary-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
      font-size: 11.5px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 0 1px var(--m3-line);
    }
    .summary-body th, .summary-body td {
      border: 1px solid var(--m3-line);
      padding: 6px 9px;
      text-align: left;
      vertical-align: top;
    }
    .summary-body th { background: var(--m3-surf-3); color: var(--m3-accent-d); font-weight: 600; }
    .summary-body tbody tr:nth-child(even) td { background: rgba(255,255,255,.025); }
    .summary-body tbody tr:hover td { background: rgba(138,180,248,.06); }
    .summary-placeholder {
      color: var(--m3-on-4);
      font-style: italic;
      text-align: center;
      padding: 44px 0;
      line-height: 1.8;
    }
    .summary-placeholder b { color: var(--m3-accent-d); font-style: normal; }

    /* Summary modal action buttons (inline-styled in markup → unify here) */
    #sum-export-btn {
      background: var(--m3-ok-ctr) !important;
      border-color: transparent !important;
      color: var(--m3-ok) !important;
      border-radius: 20px !important;
      padding: 7px 14px !important;
    }
    #sum-export-btn:hover:not(:disabled) { background: #1d4b3f !important; }
    #sum-copy-btn {
      border-radius: 20px !important;
      padding: 7px 14px !important;
      background: var(--m3-surf-3) !important;
      color: var(--m3-on-2) !important;
      border-color: transparent !important;
    }
    #sum-copy-btn:hover:not(:disabled) { background: var(--m3-surf-4) !important; color: var(--m3-on) !important; }
    #sum-close-btn {
      border-radius: 50% !important;
      width: 30px; height: 30px;
      padding: 0 !important;
      background: transparent !important;
      color: var(--m3-on-3) !important;
      border-color: transparent !important;
    }
    #sum-close-btn:hover { background: var(--m3-hover) !important; color: var(--m3-on) !important; }
    /* generate = the ONE hero gradient (primary affordance only) */
    #sum-generate-btn {
      background-image: var(--m3-grad) !important;
      background-color: transparent !important;
      border-color: transparent !important;
      color: #fff !important;
      font-weight: 600;
      border-radius: 20px !important;
      padding: 8px 18px !important;
      box-shadow: 0 2px 10px rgba(50,90,220,.30);
    }
    #sum-generate-btn:hover:not(:disabled) {
      background-image: var(--m3-grad-h) !important;
      box-shadow: 0 4px 16px rgba(70,110,240,.42);
    }
    #sum-status { font-size: 11.5px !important; color: var(--m3-on-3) !important; }

    /* ── Reduced motion (cross-cutting a11y fix none of the candidates
       addressed). At meeting cadence the per-caption entrance fires
       constantly; honor the OS preference and drop the translateY so
       captions settle without visual fatigue. ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
      .entry { animation: none; }
      .live-dot, .status .dot, #cc-btn.loading { animation: none !important; }
    }

    /* ============ PATCH: light theme + frameless controls + icon sizing ============ */
    :root[data-theme="light"] {
      /* Warm cream (be-cam ấm nhè nhẹ) — nền KHÔNG trắng chói, tonal elevation M3, WCAG-verified contrast */
      --m3-bg:#f3ece0; --m3-surf:#fbf6ee; --m3-surf-1:#f7f1e6; --m3-surf-2:#fdfbf6;
      --m3-surf-3:#ece4d6; --m3-surf-4:#e2d8c6;
      --m3-line:rgba(64,52,30,.10); --m3-line-2:rgba(64,52,30,.16);
      --m3-canvas:radial-gradient(120% 90% at 50% -10%, #fdfbf6 0%, #f3ece0 60%);
      --m3-sheen:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 46%);
      --m3-hover:rgba(60,48,28,.05); --m3-press:rgba(60,48,28,.10); --m3-hover-on:rgba(26,98,212,.10);
      --m3-accent:#1a62d4; --m3-accent-d:#1750b8; --m3-accent-ctr:#dce8fb; --m3-accent-on:#0c2c63;
      --m3-ok:#1f7a5e; --m3-ok-ctr:#cdeadd; --m3-warn:#8a5e10; --m3-err:#b3261e; --m3-err-ctr:#f7d9d6;
      --m3-on:#15120c; --m3-on-2:#322e27; --m3-on-3:#4f493f; --m3-on-4:#6f685b;
      --m3-e1:0 1px 2px rgba(74,58,32,.16), 0 1px 3px 1px rgba(74,58,32,.10);
      --m3-e2:0 6px 18px rgba(64,50,28,.16), 0 2px 6px rgba(64,50,28,.11);
      --m3-pop:0 24px 60px rgba(50,40,24,.22), 0 6px 18px rgba(50,40,24,.16);
      --m3-ring-edge:rgba(26,98,212,.85); --m3-ring-glow:rgba(26,98,212,.22);
    }
    body, .header, .status, .footer, .modal, .entry, .win-card { transition: background-color .2s ease, color .2s ease, border-color .2s ease; }

    /* Task 1: đồng bộ height icon header (gear/pin) — bỏ lệch do inline style cũ */
    .icon-btn { width:30px; height:30px; padding:0 !important; display:inline-flex; align-items:center; justify-content:center; font-size:14px; line-height:1; border-radius:8px; }

    /* Frameless: nút điều khiển cửa sổ tự vẽ trong header */
    .win-ctrls { display:inline-flex; align-items:center; gap:2px; margin-left:2px; -webkit-app-region:no-drag; }
    .win-ctrl { width:30px; height:30px; padding:0; border:none; border-radius:8px; background:transparent; color:var(--m3-on-2); font-size:13px; line-height:1; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:background var(--m3-t), color var(--m3-t); }
    .win-ctrl svg { display:block; pointer-events:none; }
    .win-ctrl:hover { background:var(--m3-hover); color:var(--m3-on); }
    .win-close:hover { background:#e81123; color:#fff; }
    .empty-hint { font-size:11px; }

    /* ── Flag picker (chip: cờ SVG + tên — emoji cờ không render trên Windows) ── */
    .flagrow { display:flex; gap:6px; flex-wrap:wrap; }
    .flag-btn {
      display:inline-flex; align-items:center; gap:6px;
      padding:5px 10px 5px 7px !important; border-radius:999px !important;
      border:1px solid var(--m3-line-2) !important; background:var(--m3-surf-3) !important;
      color:var(--m3-on-2) !important; font-size:11.5px; font-weight:600; line-height:1; cursor:pointer;
      opacity:.7; filter:grayscale(.45);
      transition:opacity var(--m3-t), background var(--m3-t), color var(--m3-t), box-shadow var(--m3-t), transform var(--m3-dur) var(--m3-ease);
    }
    .flag-btn .fl { width:21px; height:14px; border-radius:3px; overflow:hidden; flex-shrink:0; display:inline-flex; box-shadow:0 0 0 1px rgba(0,0,0,.12); }
    .flag-btn .fl svg { width:100%; height:100%; display:block; }
    .flag-btn .fl.auto { font-size:13px; align-items:center; justify-content:center; box-shadow:none; }
    .flag-btn .fl-name { pointer-events:none; }
    .flag-btn svg, .flag-btn .fl { pointer-events:none; }
    .flag-btn:hover { opacity:.95; filter:none; }
    .flag-btn:active { transform:scale(.96); }
    .flag-btn.active { opacity:1; filter:none; background:var(--m3-accent-ctr) !important; color:var(--m3-accent-on) !important; border-color:transparent !important; box-shadow:0 0 0 1px var(--m3-accent); }

    /* ── Quick language selector cạnh nút ▶ (nguồn → đích) ── */
    .lang-quick { position:relative; display:inline-flex; align-items:center; gap:5px; flex-shrink:0; }
    .lq-flag { width:30px; height:20px; padding:0 !important; border-radius:5px !important; overflow:hidden; border:1px solid var(--m3-line-2) !important; background:var(--m3-surf-3) !important; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:box-shadow var(--m3-t), transform var(--m3-dur) var(--m3-ease); }
    .lq-flag:hover { box-shadow:0 0 0 2px var(--m3-line-2); }
    .lq-flag:active { transform:scale(.94); }
    .lq-flag .fl { width:100%; height:100%; display:inline-flex; }
    .lq-flag .fl svg { width:100%; height:100%; display:block; }
    .lq-arrow { color:var(--m3-on-3); font-size:12px; font-weight:700; line-height:1; }
    .lq-pop { position:absolute; top:calc(100% + 7px); z-index:65; display:none; flex-wrap:wrap; gap:6px; width:max-content; max-width:230px; background:var(--m3-surf-2); border:1px solid var(--m3-line); border-radius:14px; padding:8px; box-shadow:var(--m3-pop); -webkit-app-region:no-drag; }
    #lq-src-pop { left:0; } #lq-tgt-pop { left:34px; }
    .lq-pop.open { display:flex; animation:dialogIn .16s var(--m3-ease); }
    .lq-flag.lq-disabled { opacity:.55; cursor:default; }
    .lq-flag .fl.auto { align-items:center; justify-content:center; font-size:12px; }

    /* ── Nút loa: đọc to bản dịch (luôn hiện). Bấm → popup chọn giọng (có "Tắt"). TẮT = xám mờ, BẬT = nền accent ── */
    .lq-tts { width:26px; height:20px; padding:0 !important; margin-left:2px; border-radius:6px !important;
      border:1px solid var(--m3-line-2) !important; background:var(--m3-surf-3) !important;
      display:inline-flex; align-items:center; justify-content:center; font-size:12px; line-height:1; cursor:pointer;
      opacity:.55; filter:grayscale(1);
      transition:opacity var(--m3-t), background var(--m3-t), box-shadow var(--m3-t), transform var(--m3-dur) var(--m3-ease); }
    .lq-tts:hover { opacity:.9; filter:none; box-shadow:0 0 0 2px var(--m3-line-2); }
    .lq-tts:active { transform:scale(.92); }
    .lq-tts.active { opacity:1; filter:none; background:var(--m3-accent-ctr) !important; border-color:transparent !important; box-shadow:0 0 0 1px var(--m3-accent); }
    .lq-tts.speaking { animation:blink 1s infinite; }
    /* popup chọn giọng — list dọc, neo phải dưới nút loa */
    .lq-tts-pop { left:auto !important; right:0; flex-direction:column !important; flex-wrap:nowrap !important; gap:2px !important; max-width:none !important; min-width:128px; max-height:260px; overflow-y:auto; }
    .lq-tts-opt { display:flex; align-items:center; gap:7px; width:100%; text-align:left; background:transparent !important; border:none !important;
      color:var(--m3-on-2) !important; padding:7px 10px; border-radius:8px !important; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;
      transition:background var(--m3-t), color var(--m3-t); }
    .lq-tts-opt:hover { background:var(--m3-hover) !important; color:var(--m3-on) !important; }
    .lq-tts-opt.sel { background:var(--m3-accent-ctr) !important; color:var(--m3-accent-on) !important; }
    .lq-tts-opt .tk { width:14px; display:inline-flex; justify-content:center; flex-shrink:0; }

    /* ── Theme switch (☀️ ⟷ 🌙) — bên nào đang chọn thì sáng + núm trượt sang đó ── */
    .theme-switch { position:relative; width:52px; height:26px; flex-shrink:0; padding:0 !important; border-radius:999px !important; border:1px solid var(--m3-line-2) !important; background:var(--m3-surf-3) !important; display:inline-flex; align-items:center; cursor:pointer; }
    .theme-switch .theme-ic { position:relative; z-index:1; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; line-height:1; opacity:.4; transition:opacity .18s var(--m3-ease); }
    .theme-switch .theme-knob { position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--m3-accent-ctr); box-shadow:var(--m3-e1); transition:transform .2s var(--m3-ease); z-index:0; }
    :root[data-theme="dark"]  .theme-switch .theme-knob { transform:translateX(26px); }
    :root[data-theme="light"] .theme-switch .sun  { opacity:1; }
    :root[data-theme="dark"]  .theme-switch .moon { opacity:1; }

    /* ── Radio dịch vụ (Online / Offline) ── */
    .radio-row { display:flex; gap:8px; }
    .radio-opt { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:7px 10px; border-radius:999px; border:1px solid var(--m3-line-2); background:var(--m3-surf-3); color:var(--m3-on-2); font-size:12px; font-weight:600; cursor:pointer; transition:background var(--m3-t), color var(--m3-t), box-shadow var(--m3-t); }
    .radio-opt input { accent-color:var(--m3-accent); width:13px; height:13px; margin:0; cursor:pointer; }
    .radio-opt:has(input:checked), .radio-opt.active { background:var(--m3-accent-ctr); color:var(--m3-accent-on); border-color:transparent; box-shadow:0 0 0 1px var(--m3-accent); }


    /* ── Group label trong menu ── */
    .app-menu .menu-group-label { font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--m3-on-3); padding:8px 8px 2px; }


    /* ── Popup chọn kiểu xuất (gốc / cả hai / bản dịch) — nổi phía trên nút Xuất ── */
    .export-wrap { position:relative; display:inline-flex; }
    .export-menu {
      position:absolute; bottom:calc(100% + 8px); right:0; z-index:70;
      display:none; flex-direction:column; gap:2px; min-width:172px;
      background:var(--m3-surf-2); border:1px solid var(--m3-line);
      border-radius:14px; padding:6px; box-shadow:var(--m3-pop);
    }
    .export-menu.open { display:flex; animation:dialogIn .16s var(--m3-ease); }
    .export-menu .export-opt {
      display:flex; align-items:center; gap:8px; width:100%; text-align:left;
      background:transparent !important; border:none !important; color:var(--m3-on-2) !important;
      padding:9px 11px; border-radius:9px !important; font-size:12.5px; font-weight:600; cursor:pointer;
      transition:background var(--m3-t), color var(--m3-t);
    }
    .export-menu .export-opt:hover { background:var(--m3-hover) !important; color:var(--m3-on) !important; }

    /* ===================== Material 3 EXPRESSIVE restyle (append → cascade override) =====================
       Màu rực hơn (cả dark/light) · shape lớn & đa dạng (pill buttons, card/modal bo to) · motion nảy (springy)
       · type đậm hơn. Layer LÊN token/component có sẵn — không phá CSS chức năng. ============================ */
    :root {
      --m3-ease: cubic-bezier(.34, 1.46, .64, 1);   /* springy overshoot */
      --m3-dur:  .2s;
      --m3-t:    .22s cubic-bezier(.34, 1.46, .64, 1);
      --m3-accent:#a8c7ff; --m3-accent-d:#c9dcff; --m3-accent-ctr:#29426e; --m3-accent-on:#dbe8ff;
      --m3-grad:   linear-gradient(135deg,#3b6ef0 0%,#6a5cf0 55%,#9a5cf0 100%);
      --m3-grad-h: linear-gradient(135deg,#4d7eff 0%,#7b6cff 55%,#ab6cff 100%);
      --m3-ok:#79e0b8; --m3-warn:#f7cf86;
    }
    :root[data-theme="light"] {
      --m3-accent:#1a56d6; --m3-accent-d:#1648b8; --m3-accent-ctr:#dde6fc; --m3-accent-on:#0c2860;
      --m3-grad:   linear-gradient(135deg, #1a62d4 0%, #3f5be8 60%, #5a4fe0 100%);
      --m3-grad-h: linear-gradient(135deg, #2b71e6 0%, #506cf2 60%, #6a5ff0 100%);
    }
    /* Shape — expressive radii (pill cho buttons, bo to cho card/modal) */
    .btn-save, #settings-cancel, #sum-export-btn, #sum-copy-btn, #sum-generate-btn, #sum-cancel-btn,
    #scroll-btn, #sum-btn, #clear-btn, #cc-btn, #export-orig-btn, #s-toggle-vis,
    .icon-btn, .win-ctrl, .modal-x { border-radius: 999px !important; }
    select, #s-apikey, #s-provider, #s-capture, #s-mic-device,
    .modal input[type="password"], .modal input[type="text"] { border-radius: 14px !important; }
    .entry, .win-card, .hint-banner, .error-banner, .summary-body { border-radius: 20px; }
    .modal { border-radius: 28px !important; }
    .entry.live::before { width: 4px; border-radius: 0 4px 4px 0; }
    /* Type — đậm/expressive hơn */
    .header-title { font-weight: 700; letter-spacing: .2px; }
    .modal h3 { font-weight: 700; }
    .modal label { font-weight: 600; letter-spacing: .4px; }
    .entry-author { font-weight: 700; }
    .tab-btn { font-weight: 600; }
    select, button { font-weight: 600; }
    /* Motion — nhấn nảy nhẹ (springy); .win-card nhấc cao hơn khi hover */
    button:active { transform: scale(.96); }
    .win-card:hover { transform: translateY(-2px); }
    .entry.live { box-shadow: 0 0 0 1.5px var(--m3-accent), var(--m3-e1); }

    /* ── M3 loading indicators (circular indeterminate) ── */
    @keyframes m3-spin { to { transform: rotate(360deg); } }
    /* Status dot → spinner vòng khi loading/connecting/waiting (running=dot xanh, error=dot đỏ giữ nguyên) */
    .status.loading .dot, .status.connecting .dot,
    .status.waiting .dot, .status.waiting-captions .dot {
      width: 13px; height: 13px;
      background: transparent !important;
      border: 2px solid var(--m3-warn);
      border-top-color: transparent;
      box-shadow: none !important;
      animation: m3-spin .7s linear infinite !important;
    }
    /* Spinner lớn cho Summary đang tạo */
    .m3-spinner-lg {
      width: 42px; height: 42px; border-radius: 50%;
      border: 3.5px solid var(--m3-accent-ctr);
      border-top-color: var(--m3-accent);
      animation: m3-spin .85s cubic-bezier(.5,.15,.5,.85) infinite;
      margin: 0 auto 16px;
    }
    .summary-loading { text-align: center; padding: 44px 0; color: var(--m3-on-3); font-size: 12.5px; }
    /* Spinner nhỏ trong nút (vd nút Tóm tắt đang chạy) */
    .m3-spinner-sm {
      display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
      border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%;
      animation: m3-spin .7s linear infinite;
    }

    /* ── Header ⋮ dropdown (gộp ngôn ngữ dịch / ngôn ngữ app / theme / export / settings) ── */
    .header, .status { position: relative; }
    .app-menu {
      position: absolute; top: calc(100% + 6px); right: 6px; z-index: 60;
      display: none; flex-direction: column; gap: 2px; width: 280px; max-width: calc(100vw - 12px);
      max-height: calc(100vh - 56px); overflow-x: hidden; overflow-y: auto;
      background: var(--m3-surf-2); border: 1px solid var(--m3-line);
      border-radius: 18px; padding: 8px; box-shadow: var(--m3-pop);
      -webkit-app-region: no-drag;
      scrollbar-width: thin; scrollbar-color: var(--m3-surf-4) transparent;
    }
    .app-menu::-webkit-scrollbar { width: 8px; }
    .app-menu::-webkit-scrollbar-thumb { background: var(--m3-surf-4); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
    .app-menu::-webkit-scrollbar-track { background: transparent; }
    .app-menu.open { display: flex; animation: dialogIn .16s var(--m3-ease); }
    /* separator giữa các nhóm trong menu */
    .app-menu .menu-sep { height: 1px; background: var(--m3-line); margin: 4px 6px; }
    .app-menu .menu-row { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px 8px; }
    /* field trong menu: bỏ viền, giữ nền fill phẳng.
       Phải nâng specificity (.app-menu #id) để đè border !important của ID selector từ CSS modal cũ. */
    .app-menu select,
    .app-menu #s-provider,
    .app-menu #s-capture,
    .app-menu #s-mic-device { border: none !important; max-width: 100%; }
    .app-menu .menu-row > span { font-size: 11px; font-weight: 600; color: var(--m3-on-3); letter-spacing: .3px; }
    .app-menu .menu-row select { width: 100%; }
    .app-menu .menu-item {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      background: transparent !important; border: none !important; color: var(--m3-on-2) !important;
      padding: 9px 10px; border-radius: 12px !important; font-size: 12.5px; font-weight: 600; cursor: pointer;
      transition: background var(--m3-t), color var(--m3-t);
    }
    .app-menu .menu-item:hover:not(:disabled) { background: var(--m3-hover) !important; color: var(--m3-on) !important; }
    .app-menu .menu-item:disabled { opacity: .4; cursor: default; }
    .app-menu .menu-item > span:first-child { width: 18px; text-align: center; }

    /* ── Status bar: play (▶/⏹) bên trái; ⋮ menu đẩy sang phải cùng hàng; dot CHỈ hiện làm spinner khi đang load ── */
    #cc-btn { margin-left: 0 !important; }
    /* theme + ⋮ gom về cạnh phải status; theme nằm trái ⋮ */
    #status #theme-btn, #status #menu-btn { flex-shrink: 0; }
    #status #theme-btn { margin-left: auto; }
    .status .dot { display: none; }
    .status.loading .dot, .status.connecting .dot, .status.waiting .dot, .status.waiting-captions .dot { display: block; }
    #status-msg { font-size: 11.5px; color: var(--m3-on-3); margin-left: 4px; }
    .status.error #status-msg { color: var(--m3-err); }

    /* Fix #1: chống bể layout khi cửa sổ hẹp — tiêu đề CO LẠI + cắt gọn (…) thay vì xếp dọc từng ký tự */
    .header-title { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #summary-modal h3 { min-width:88px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #summary-modal .modal > div:first-child { flex-wrap: wrap; row-gap: 6px; }
    /* Fix #2: scroll summary mượt — cô lập layout/paint (đã bỏ backdrop-filter blur ở .modal-overlay) */
    .summary-body { contain: content; }

    /* Việc mới: X đóng ở header Settings (giống ✕ summary) + nút Hủy ở Summary (giống Hủy settings) */
    .modal-x { border-radius:50% !important; width:30px; height:30px; padding:0 !important; display:inline-flex; align-items:center; justify-content:center; background:transparent !important; color:var(--m3-on-3) !important; border:none !important; font-size:13px; cursor:pointer; flex-shrink:0; transition:background var(--m3-t), color var(--m3-t); }
    .modal-x:hover { background:var(--m3-hover) !important; color:var(--m3-on) !important; }
    #sum-cancel-btn { border-radius:20px !important; padding:7px 14px !important; background:transparent !important; color:var(--m3-accent) !important; border-color:transparent !important; }
    #sum-cancel-btn:hover { background:var(--m3-hover-on) !important; color:var(--m3-accent-d) !important; }

  </style>
</head>
<body>

  <!-- Busy overlay: chặn toàn bộ tương tác khi đang tải model/tài nguyên (đổi nguồn / đổi ngôn ngữ) -->
  <div class="busy-overlay" id="busy-overlay" aria-hidden="true">
    <div class="busy-box">
      <div class="busy-spinner"></div>
      <div class="busy-text" id="busy-text" data-i18n="busy.loadingModel">Đang tải mô hình nhận dạng…</div>
    </div>
  </div>

  <!-- Summary Modal -->
  <div class="modal-overlay" id="summary-modal">
    <div class="modal" style="width:72vw;max-width:1000px;min-width:480px;height:80vh;max-height:calc(100vh - 24px);display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-shrink:0">
        <h3 style="flex:1;margin:0">📋 <span data-i18n="summary.title">Tóm tắt cuộc họp</span></h3>
        <button id="sum-export-btn" style="padding:4px 12px;font-size:12px;background:#1a4a1a;border-color:#4ec9b0;color:#4ec9b0" disabled>⬇ <span data-i18n="summary.exportMd">Xuất .md</span></button>
        <button id="sum-copy-btn" style="padding:4px 12px;font-size:12px" disabled>⎘ <span data-i18n="summary.copy">Copy</span></button>
        <button id="sum-close-btn" style="padding:4px 8px;font-size:12px">✕</button>
      </div>
      <div class="summary-body" id="sum-body">
        <div class="summary-placeholder" data-i18n-html="summary.placeholder">Nhấn <b>✨ Tóm tắt</b> để tổng hợp nội dung cuộc họp bằng AI</div>
      </div>
      <div style="margin-top:10px;flex-shrink:0;display:flex;align-items:center;gap:8px">
        <span id="sum-status" style="font-size:11px;color:#888;flex:1"></span>
        <button id="sum-cancel-btn" data-i18n="settings.cancel">Hủy</button>
        <button id="sum-generate-btn" style="padding:5px 16px;background:#1a4a78;border-color:#3794ff;color:#fff">✨ <span data-i18n="summary.generate">Tóm tắt</span></button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <span style="font-size:15px;line-height:1">💬</span>
    <span class="header-title">Caption Translator</span>
    <div class="header-controls">
      <span class="win-ctrls">
        <button id="pin-btn" class="win-ctrl" data-i18n-title="header.pinOff" title="Luôn trên đầu (đang tắt)">📌</button>
        <button id="win-min" class="win-ctrl" data-i18n-title="header.minimize" title="Thu nhỏ"><svg viewBox="0 0 11 11" width="11" height="11" aria-hidden="true"><path d="M2.5 5.5h6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></button>
        <button id="win-max" class="win-ctrl" data-i18n-title="header.maximize" title="Phóng to"><svg viewBox="0 0 11 11" width="11" height="11" aria-hidden="true"><rect x="2.4" y="2.4" width="6.2" height="6.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></button>
        <button id="win-close" class="win-ctrl win-close" data-i18n-title="header.close" title="Đóng"><svg viewBox="0 0 11 11" width="11" height="11" aria-hidden="true"><path d="M3 3l5 5M8 3l-5 5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></button>
      </span>
    </div>
  </div>

  <!-- Status -->
  <div class="status" id="status">
    <button id="cc-btn" data-i18n-title="status.ccTitle" title="Bật/tắt Live Captions trên Teams">▶</button>
    <div class="lang-quick" id="lang-quick">
      <button class="lq-flag" id="lq-src" title="Ngôn ngữ nguồn"></button>
      <span class="lq-arrow" aria-hidden="true">→</span>
      <button class="lq-flag" id="lq-tgt" data-i18n-title="header.langTitle" title="Ngôn ngữ dịch"></button>
      <button class="lq-tts" id="lq-tts" title="Đọc to bản dịch — chọn giọng" aria-haspopup="true" aria-expanded="false">🔊</button>
      <div class="lq-pop lq-tts-pop" id="lq-tts-pop"></div>
      <div class="lq-pop" id="lq-src-pop"></div>
      <div class="lq-pop" id="lq-tgt-pop"></div>
    </div>
    <div class="dot"></div>
    <span id="status-msg"></span>
    <button id="theme-btn" class="theme-switch" data-i18n-title="theme.dark" title="Sáng / Tối">
      <span class="theme-ic sun" aria-hidden="true">☀️</span>
      <span class="theme-ic moon" aria-hidden="true">🌙</span>
      <span class="theme-knob"></span>
    </button>
    <button id="menu-btn" class="icon-btn" data-i18n-title="header.menu" title="Menu">⋮</button>
    <div id="app-menu" class="app-menu">

      <!-- Nhóm: Nguồn (âm thanh + ngôn ngữ nguồn) -->
      <div class="menu-group-label" data-i18n="group.source">Nguồn</div>
      <div class="menu-row">
        <span data-i18n="settings.audioSource">Nguồn âm thanh</span>
        <select id="s-capture">
          <option value="teams" data-i18n="capture.teams">📹 Teams (Live Captions)</option>
          <option value="system" data-i18n="capture.system">🔊 Audio hệ thống</option>
          <!-- <option value="mic" data-i18n="capture.mic">🎤 Microphone</option> -->
        </select>
      </div>
      <div class="menu-row" id="s-mic-row" style="display:none">
        <span data-i18n="settings.chooseMic">Chọn Microphone</span>
        <select id="s-mic-device"></select>
      </div>
      <div class="menu-row" id="s-process-row" style="display:none">
        <span data-i18n="settings.audioProcess">Thu từ tiến trình</span>
        <select id="s-process"><option value="">Toàn hệ thống</option></select>
      </div>
      <div class="menu-sep"></div>

      <!-- Nhóm: Dịch thuật (dịch vụ) — ngôn ngữ nguồn/đích đã ra status bar cạnh ▶ -->
      <div class="menu-group-label" data-i18n="group.translate">Dịch thuật</div>
      <div class="menu-row">
        <span data-i18n="settings.service">Dịch vụ</span>
        <div class="radio-row" id="provider-radio">
          <label class="radio-opt"><input type="radio" name="provider" value="online">🌐 Online</label>
          <label class="radio-opt"><input type="radio" name="provider" value="local">🖥️ Offline</label>
        </div>
      </div>

      <div class="menu-sep"></div>

      <div class="menu-row">
        <span data-i18n="settings.uiLang">Ngôn ngữ giao diện</span>
        <div class="flagrow" id="uilang-row"></div>
      </div>
    </div>
  </div>

  <!-- Caption list -->
  <div class="list" id="list">
    <div class="empty">
      <span data-i18n="list.emptyTitle">Chờ captions từ Teams…</span><br>
      <span class="empty-hint" data-i18n="list.emptyHint">Vào meeting → bật Live Captions</span>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-count" id="count">0 câu</span>
    <div class="spacer"></div>
    <button id="scroll-btn" class="active" data-i18n-title="footer.autoScrollTitle" title="Tự cuộn xuống">↓ <span data-i18n="footer.auto">Auto</span></button>
    <button id="sum-btn" data-i18n-title="footer.summarizeTitle" title="Tóm tắt cuộc họp">📋 <span data-i18n="footer.summarize">Tóm tắt</span></button>
    <span class="export-wrap">
      <button id="export-orig-btn" data-i18n-title="status.exportOrigTitle" title="Xuất nội dung" disabled>💾 <span data-i18n="footer.export">Xuất</span></button>
      <div id="export-menu" class="export-menu">
        <button class="export-opt" data-mode="orig">📄 <span data-i18n="export.orig">Bản gốc</span></button>
        <button class="export-opt" data-mode="both">🔁 <span data-i18n="export.both">Cả hai (gốc + dịch)</span></button>
        <button class="export-opt" data-mode="trans">🌐 <span data-i18n="export.trans">Bản dịch</span></button>
      </div>
    </span>
    <button id="clear-btn" data-i18n="footer.clear">Xóa</button>
  </div>

  <script src="src/i18n.js"></script>
  <script>
    const api = window.__caption;
    const listEl    = document.getElementById('list');
    const statusEl  = document.getElementById('status');
    const statusMsg = document.getElementById('status-msg');
    const countEl   = document.getElementById('count');
    const scrollBtn = document.getElementById('scroll-btn');
    const pinBtn      = document.getElementById('pin-btn');
    const ccBtn       = document.getElementById('cc-btn');
    const exportOrigBtn = document.getElementById('export-orig-btn');

    // ── i18n (giao diện) + theme ──────────────────────────
    const I18N = window.I18N || {};
    const LOCALES = window.I18N_LOCALES || [{ code: 'vi', name: 'Tiếng Việt' }];
    let _uiLang = 'vi';
    function t(key, vars) {
      let str = (I18N[_uiLang] && I18N[_uiLang][key]) || (I18N.en && I18N.en[key]) || key;
      if (vars) for (const k in vars) str = str.split('{' + k + '}').join(vars[k]);
      return str;
    }
    function applyI18n(lang) {
      _uiLang = I18N[lang] ? lang : 'vi';
      try { document.documentElement.lang = _uiLang; } catch (e) {}
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
      document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.getAttribute('data-i18n-title')); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
      try { countEl.textContent = t('footer.count', { n: count }); } catch (e) {}
      try { pinBtn.title = t(pinned ? 'header.pinOn' : 'header.pinOff'); } catch (e) {}
      try { if (_lastStatus && (_lastStatus.type === 'error' || _lastStatus.type === 'idle') && _lastStatus.key) statusMsg.textContent = t(_lastStatus.key, _statusVars(_lastStatus.vars)); } catch (e) {}
      try { updateThemeIcon(); } catch (e) {}
      try { renderEmpty(); } catch (e) {}
    }
    let _themePref = 'auto';
    const _mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function applyTheme(pref) {
      _themePref = pref || 'auto';
      const dark = _themePref === 'dark' || (_themePref !== 'light' && (_mql ? _mql.matches : true));
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    }
    if (_mql && _mql.addEventListener) _mql.addEventListener('change', () => { if (_themePref === 'auto') applyTheme('auto'); });

    let autoScroll  = true;
    let pinned      = false;
    let count       = 0;
    let captionsOn  = false;
    let _currentSource  = 'teams'; // theo dõi nguồn hiện tại
    let _currentProvider = 'online';  // theo dõi provider hiện tại
    let _srcLang = 'ja';           // ngôn ngữ nguồn đã chọn (system/mic); Teams thì auto theo Teams
    let _tgtLang = 'vi';           // ngôn ngữ đích hiện tại (đồng bộ với cờ lq-tgt)
    // ── TTS đọc to bản dịch (Supertonic-3 đa ngữ) ── bật + giọng (sid 0-9) + có model + hàng đợi phát nối tiếp
    let _ttsOn = false, _ttsAvail = false, _ttsVoice = 0;
    let _ttsQueue = [], _ttsBusy = false, _ttsPlayCtx = null, _ttsCurSrc = null, _ttsCurEnd = null, _ttsResolvePlay = null;
    const _ttsSpoken = new Set();  // id câu đã đọc → không đọc lại khi entry cập nhật/đổi
    // M1: chặn TTS trôi (họp dày → dịch ra nhanh hơn Piper đọc → audio tụt hậu vô hạn). Giữ tổng audio CHỜ ≤ budget,
    //     bỏ câu CŨ nhất (chưa đọc) khi vượt — người nghe theo kịp hội thoại trực tiếp thay vì đọc câu cách đó vài phút.
    const _TTS_BUDGET_S = 6;        // tổng audio chờ tối đa (giây) → vượt thì bỏ câu cũ nhất
    const _TTS_HARD_S = 12;         // trần cứng → chỉ giữ câu mới nhất
    const _TTS_SPLIT_CHARS = 80;    // M2: câu dài hơn → tách theo dấu câu (≈3.5s) để đọc MỆNH ĐỀ ĐẦU sớm hơn (giảm lag)
    const _ttsEstSec = (t) => (t ? t.length : 0) * 0.045;   // ước lượng thời lượng phát (đo: 34ch→1.32s, 261ch→12.64s)
    const PROVIDER_NAMES = {
      online: 'Online (auto)', local: 'LOCAL TRANSLATE',
      // legacy — store cũ chưa migrate vẫn hiển đúng tên
      'teams-token': 'MS Translator', 'google-free': 'Google Translate',
    };
    let _mediaRecorder  = null;
    let _audioStream    = null;
    let _rawStream      = null;  // stream gốc từ getDisplayMedia (để cleanup đúng)

    // Cập nhật trạng thái nút ▶ theo status
    function setCaptionsState(on) {
      captionsOn = on;
      ccBtn.classList.toggle('active', on);
      // Đồng bộ icon theo trạng thái (⏹ đang chạy / ▶ chưa chạy) — bỏ qua khi đang chờ ⏳ sau click.
      if (!ccBtn.classList.contains('loading')) ccBtn.textContent = on ? '⏹' : '▶';
      if (_currentSource === 'teams') {
        ccBtn.title = t(on ? 'cc.captionsOn' : 'cc.captionsOff');
      } else {
        ccBtn.title = t(on ? 'cc.recOn' : 'cc.recOff');
      }
    }

    // Placeholder rỗng theo nguồn: Teams → "Chờ captions từ Teams…"; system/mic → "Đang nghe âm thanh…".
    // force=true: ép vẽ lại (dùng cho nút Xóa). Không ép: chỉ cập nhật khi list đang trống.
    function renderEmpty(force) {
      if (!force && !listEl.querySelector('.empty')) return;
      const audio = _currentSource !== 'teams';
      listEl.innerHTML =
        '<div class="empty"><span>' + t(audio ? 'list.emptyAudioTitle' : 'list.emptyTitle') + '</span><br>' +
        '<span class="empty-hint">' + t(audio ? 'list.emptyAudioHint' : 'list.emptyHint') + '</span></div>';
    }

    // Map: id → { author, original, translated } — lưu để tổng hợp cuộc họn (KHÔNG cap → giữ đủ cho summary/export)
    const captionData = new Map();

    // Map: id → div element (để cập nhật bản dịch in-place)
    const entryEls = new Map();

    // Cap số node .entry trong DOM cho họp dài (RAM renderer + reflow). captionData vẫn giữ đủ.
    // MAX phải lớn hơn nhiều số câu sinh ra trong ~3s (cửa sổ reuseId) để không evict nhầm dòng đang sống.
    const MAX_ENTRIES = 300;
    const _retired = new Set();   // id đã bị evict khỏi DOM → chỉ cập nhật data, không tái tạo node

    // Kiểm tra API key và lấy nguồn dịch khi khởi động
    api.getSettings().then(s => {
      applyTheme(s.theme || 'auto');
      applyI18n(s.uiLang || 'vi');
      updateThemeIcon();
      try { setFlagActive(uilangRow, s.uiLang || 'vi'); } catch (e) {}
      // Khôi phục ngôn ngữ ĐÍCH (quick selector cạnh ▶) + báo backend.
      const _lang = s.lang || 'vi';
      _tgtLang = _lang;
      try { setQuickFlag(lqTgt, _lang); setFlagActive(lqTgtPop, _lang); } catch (e) {}
      api.setLang(_lang);
      _ttsOn = !!s.ttsEnabled;
      _ttsVoice = Math.max(0, Math.min(9, parseInt(s.ttsVoice, 10) || 0));
      // Ngôn ngữ NGUỒN (system/mic): mặc định 'ja' (app JP→VI) nếu chưa lưu → lưu để feed Whisper.
      // (Hiển thị cờ/auto do applyCaptureUI quyết theo nguồn — Teams = auto.)
      _srcLang = s.srcLang || 'ja';
      try { setFlagActive(lqSrcPop, _srcLang); } catch (e) {}
      if (!s.srcLang) api.saveSettings({ srcLang: _srcLang });
      _currentSource = s.captureSource || 'teams';
      _audioProcessPid = s.audioProcessPid || '';
      _audioProcessTitle = s.audioProcessTitle || '';
      try { renderEmpty(); } catch (e) {}
      const prov = s.provider || 'online';
      _currentProvider = prov;
      try {
        setProviderRadio(prov);
        if (sCapture)  { sCapture.value = _currentSource; applyCaptureUI(_currentSource); }
        if (_currentSource === 'mic') loadMicDevices(s.micDeviceId || '');
        if (_currentSource === 'system') loadAudioProcesses(_audioProcessPid, _audioProcessTitle);
      } catch (e) {}
      // TTS: hỏi main đã có model Piper vi chưa → quyết hiện nút loa (applyCaptureUI ở trên đã gọi refreshTtsBtn,
      // nhưng lúc đó _ttsAvail còn false; query xong refresh lại). Bật sẵn từ lần trước → nạp model nền.
      try {
        api.ttsAvailable().then(ok => { _ttsAvail = !!ok; refreshTtsBtn(); if (_ttsOn && _ttsAvail) { try { api.ttsWarm(); } catch (e) {} } });
      } catch (e) {}
    });

    // (Ngôn ngữ đích khôi phục từ settings đã lưu trong api.getSettings().then ở trên)

    // ── Status ──
    // Lưu status gần nhất + resolve var {lang} (code → tên ngôn ngữ bản địa) để hiển theo UI lang.
    let _lastStatus = null;
    function _statusVars(v) {
      if (!v) return v;
      if (v.lang) { const L = LOCALES.find(l => l.code === v.lang); return Object.assign({}, v, { lang: L ? L.name : v.lang }); }
      return v;
    }
    // Busy overlay: chặn toàn trang khi main đang tải model/tài nguyên (đổi nguồn / đổi ngôn ngữ).
    // Safety timeout: tự ẩn sau 20s phòng khi thiếu sự kiện 'busy off' (không kẹt overlay vĩnh viễn).
    const busyOverlay = document.getElementById('busy-overlay');
    const busyText    = document.getElementById('busy-text');
    let _busyTimer = null;
    api.onBusy(({ on, key, msg } = {}) => {
      if (_busyTimer) { clearTimeout(_busyTimer); _busyTimer = null; }
      if (on) {
        if (busyText) busyText.textContent = key ? t(key) : (msg || t('busy.loadingModel'));
        busyOverlay.classList.add('open');
        busyOverlay.setAttribute('aria-hidden', 'false');
        _busyTimer = setTimeout(() => { busyOverlay.classList.remove('open'); busyOverlay.setAttribute('aria-hidden', 'true'); }, 20000);
      } else {
        busyOverlay.classList.remove('open');
        busyOverlay.setAttribute('aria-hidden', 'true');
      }
    });

    api.onStatus(({ type, msg, key, vars }) => {
      _lastStatus = { type, msg, key, vars };
      statusEl.className = 'status ' + type;            // dot → spinner khi loading/connecting/waiting
      // Nút play KHÔNG bám status 'running' nữa (tránh local-LLM 'ready'/infra làm nút tự thành ⏹ lúc boot).
      // Trạng thái play do cc-state quyết định (= userActive ở main) — xem api.onCcState bên dưới.
      // Routine/loading: KHÔNG hiện text (play + spinner đã thể hiện). Hiện text khi LỖI hoặc IDLE (gợi ý bấm ▶).
      statusMsg.textContent = (type === 'error' || type === 'idle') ? (key ? t(key, _statusVars(vars)) : (msg || '')) : '';

      if (type === 'waiting-captions') {
        if (!listEl.querySelector('.entry')) {
          listEl.innerHTML = '';
          const banner = document.createElement('div');
          banner.className = 'hint-banner';
          banner.innerHTML = t('banner.captionHelp');
          listEl.appendChild(banner);
        }
      }
      // Banner hướng dẫn CDP CHỈ cho lỗi kết nối Teams (không phải mọi lỗi như STT/LLM)
      if (type === 'error' && (key === 'status.cdpFailed' || key === 'status.teamsNotFound')) {
        listEl.innerHTML = '';
        const banner = document.createElement('div');
        banner.className = 'error-banner';
        banner.innerHTML = t('banner.cdpHelp');
        listEl.appendChild(banner);
      }
    });

    // Tạo cấu trúc DOM của 1 entry MỘT LẦN; lưu ref các text-node con để cập nhật in-place
    // (tránh reparse toàn bộ innerHTML 2 lần/câu — pending rồi translated).
    function buildEntry(el) {
      const meta = document.createElement('div'); meta.className = 'entry-meta';
      const a  = document.createElement('span'); a.className  = 'entry-author';
      const tm = document.createElement('span'); tm.className = 'entry-time';
      meta.appendChild(a); meta.appendChild(tm);
      const orig = document.createElement('div'); orig.className = 'entry-original';
      const tr   = document.createElement('div'); tr.className   = 'entry-translated';
      el.appendChild(meta); el.appendChild(orig); el.appendChild(tr);
      el._author = a; el._ts = tm; el._orig = orig; el._tr = tr;
    }

    // rAF auto-scroll: gộp nhiều caption vào 1 reflow/frame thay vì ép layout đồng bộ mỗi câu.
    let _scrollPending = false;
    function scheduleScroll() {
      if (_scrollPending || !autoScroll) return;
      _scrollPending = true;
      requestAnimationFrame(() => {
        _scrollPending = false;
        if (autoScroll) listEl.scrollTop = listEl.scrollHeight;
      });
    }

    // ── A1: hiện DẦN text nguồn của PARTIAL (mọc đơn điệu) → "chảy" mượt thay vì nhảy cục mỗi chunk ~560ms.
    //   Chỉ smooth partial (preview nguồn streaming); câu CHỐT hiện đủ ngay. 0 CPU inference (thuần render, rAF).
    const _revealing = new Set();   // entry el đang lộ dần (_origShown < _origFull.length)
    let _revealRAF = 0;
    function _startReveal() { if (!_revealRAF) _revealRAF = requestAnimationFrame(_revealTick); }
    function _revealTick() {
      _revealRAF = 0;
      for (const el of [..._revealing]) {
        const full = el._origFull || '';
        let shown = el._origShown || 0;
        if (shown >= full.length) { _revealing.delete(el); el._origShown = full.length; continue; }
        // ease-out: đuổi ~10% khoảng cách mỗi frame (min 1 ký tự) → lộ hết ~350-450ms, liền mạch khi chunk mới tới.
        shown = Math.min(full.length, shown + Math.max(1, Math.ceil((full.length - shown) * 0.10)));
        el._origShown = shown;
        el._orig.textContent = full.slice(0, shown);
      }
      if (_revealing.size) _startReveal();
    }

    // ── Caption: hiển/cập nhật entry (pending rồi được dịch) ──
    api.onCaptionLive(({ id, author, original, translated, ts, tsMs, isPartial }) => {
      listEl.querySelector('.empty, .hint-banner')?.remove();

      const isPending  = translated === '…';
      const isFailed   = translated === null;

      // Cập nhật captionData cho summary (giữ tsMs lần đầu để tính duration meeting) — LUÔN làm,
      // kể cả khi node DOM đã bị evict, để export/summary không mất dòng.
      // isPartial (preview dịch streaming, chưa chốt) → KHÔNG lưu: tránh export dính bản dịch partial chất lượng
      // thấp khi endpoint chưa kịp trả. Bản chốt authoritative (không isPartial) sẽ ghi đè entry này.
      if (!isPending && !isPartial) {
        const prev = captionData.get(id);
        captionData.set(id, {
          author, original, translated,
          ts:   ts   || prev?.ts,
          tsMs: prev?.tsMs || tsMs || Date.now(),
        });
        exportOrigBtn.disabled = false;   // có nội dung → bật nút export
        // Đọc to bản dịch (nếu bật loa) — chỉ câu CHỐT, không pending/partial/lỗi, mỗi id 1 lần.
        if (_ttsOn && !isFailed && translated) ttsEnqueue(id, translated);
      }

      // Entry đã bị evict khỏi DOM (họp dài) → chỉ giữ data ở trên, KHÔNG tái tạo node
      // (tránh node mọc sai thứ tự + đếm 'câu' sai khi bản dịch tới muộn).
      if (_retired.has(id)) return;

      let el = entryEls.get(id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'entry';
        el.dataset.id = id;
        buildEntry(el);
        listEl.appendChild(el);
        entryEls.set(id, el);
        count++;
        countEl.textContent = t('footer.count', { n: count });
        // Cap DOM: evict entry CŨ NHẤT khi vượt ngưỡng (chỉ gỡ khỏi DOM + entryEls; giữ captionData & count).
        while (entryEls.size > MAX_ENTRIES) {
          const oldest = listEl.firstElementChild;
          if (!oldest || !oldest.classList.contains('entry')) break;
          const oid = Number(oldest.dataset.id);
          listEl.removeChild(oldest);
          entryEls.delete(oid);
          _retired.add(oid);
        }
      }

      // Cập nhật từng text-node con — chỉ ghi khi đổi (reuseId có thể đổi author/original).
      // textContent tự escape nên không cần esc().
      if (el._author.textContent !== (author || '')) el._author.textContent = author || '';
      if (el._ts.textContent !== (ts || '')) el._ts.textContent = ts || '';
      // A1: PARTIAL → lộ dần phần nguồn mới (chảy mượt); CHỐT/không-partial → hiện đủ ngay (snap).
      const _origStr = original || '';
      if (isPartial) {
        el._origFull = _origStr;
        if ((el._origShown || 0) < _origStr.length) { _revealing.add(el); _startReveal(); }
        else if ((el._origShown || 0) > _origStr.length) { el._origShown = _origStr.length; el._orig.textContent = _origStr; }   // partial mới ngắn hơn (reset câu) → snap
      } else {
        el._origFull = _origStr; el._origShown = _origStr.length; _revealing.delete(el);
        if (el._orig.textContent !== _origStr) el._orig.textContent = _origStr;
      }
      if (isPending) {
        el._tr.innerHTML = '<span style="color:var(--m3-on-2);font-style:italic">đang dịch…</span>';
      } else if (isFailed) {
        el._tr.innerHTML = '<span style="color:var(--m3-on-4);font-style:italic">—</span>';
      } else {
        el._tr.textContent = translated;
      }

      scheduleScroll();
    });

    // ── CC state từ main process (5s check + sau toggle) ──
    api.onCcState(({ active }) => {
      setCaptionsState(active);
    });

    // ── Settings (đã gộp hết vào dropdown ⋮ — apply + lưu NGAY khi đổi) ──
    const sCapture      = document.getElementById('s-capture');
    const sMicRow       = document.getElementById('s-mic-row');
    const sMicDevice    = document.getElementById('s-mic-device');
    const sProcessRow   = document.getElementById('s-process-row');
    const sProcess      = document.getElementById('s-process');
    const providerRadio = document.getElementById('provider-radio');

    // Nguồn = mic → hiện ô chọn microphone. Ngôn ngữ nguồn (lq-src cạnh ▶):
    //  - Teams: KHÔNG chọn được → icon 🌐 auto + disable (spoken language là cài đặt CHUNG của meeting,
    //    đổi sẽ đổi cho MỌI người → để Teams tự dò theo người nói).
    //  - system/mic: chọn tay → hiện cờ _srcLang, bấm mở picker.
    function applyCaptureUI(source) {
      sMicRow.style.display = source === 'mic' ? '' : 'none';
      // "Thu từ tiến trình" chỉ áp cho Audio hệ thống (Teams dùng UIA, mic là thiết bị vào — không loopback tiến trình).
      if (sProcessRow) sProcessRow.style.display = source === 'system' ? '' : 'none';
      const lqSrcEl = document.getElementById('lq-src');
      if (lqSrcEl) {
        const teams = source === 'teams';
        lqSrcEl.classList.toggle('lq-disabled', teams);
        lqSrcEl.innerHTML = teams ? '<span class="fl auto">🌐</span>' : flagInner(_srcLang);
        lqSrcEl.title = teams ? t('srcLang.auto') : t('settings.srcLang');
        if (teams) { const p = document.getElementById('lq-src-pop'); if (p) p.classList.remove('open'); }
      }
      try { refreshTtsBtn(); } catch (e) {}   // đổi nguồn → cập nhật hiện/ẩn nút loa (en→vi)
    }

    // provider radio (Online / Offline) → lưu ngay. Đồng bộ class .active (fallback nếu :has() không hỗ trợ).
    function syncProviderActive() {
      if (!providerRadio) return;
      providerRadio.querySelectorAll('.radio-opt').forEach(opt => {
        const inp = opt.querySelector('input');
        opt.classList.toggle('active', !!(inp && inp.checked));
      });
    }
    function setProviderRadio(prov) {
      const r = providerRadio && providerRadio.querySelector('input[value="' + prov + '"]');
      if (r) r.checked = true;
      syncProviderActive();
    }
    providerRadio.addEventListener('change', (e) => {
      syncProviderActive();
      if (e.target && e.target.value) api.saveSettings({ provider: e.target.value });
    });

    async function loadMicDevices(currentId) {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter(d => d.kind === 'audioinput');
        sMicDevice.innerHTML = mics.length
          ? mics.map(d => `<option value="${esc(d.deviceId)}">${esc(d.label || 'Microphone ' + d.deviceId.slice(0, 8))}</option>`).join('')
          : '<option value="">Không tìm thấy microphone</option>';
        if (currentId && [...sMicDevice.options].some(o => o.value === currentId))
          sMicDevice.value = currentId;
      } catch {
        sMicDevice.innerHTML = '<option value="">Không thể liệt kê thiết bị</option>';
      }
    }

    sCapture.addEventListener('change', () => {
      applyCaptureUI(sCapture.value);
      if (sCapture.value === 'mic') loadMicDevices(sMicDevice.value);
      if (sCapture.value === 'system') loadAudioProcesses(_audioProcessPid, _audioProcessTitle);
      api.saveSettings({ captureSource: sCapture.value, micDeviceId: sMicDevice.value });
    });

    sMicDevice.addEventListener('change', () => {
      api.saveSettings({ micDeviceId: sMicDevice.value });
    });

    // ── Thu theo TIẾN TRÌNH (Audio hệ thống): "Toàn hệ thống" + danh sách tiến trình có cửa sổ ──
    // Chọn 1 tiến trình → main thu chỉ tiến trình đó (Process Loopback) → KHÔNG thu tiếng TTS của app → hết feedback.
    let _audioProcessPid = '', _audioProcessTitle = '';
    async function loadAudioProcesses(curPid, curTitle) {
      if (!sProcess) return;
      let procs = [];
      try { procs = await api.listAudioProcesses() || []; } catch (e) {}
      // Giữ "Toàn hệ thống" + lựa chọn đã lưu (kể cả khi tiến trình đó không còn trong danh sách cửa sổ hiện tại).
      const opts = ['<option value="">Toàn hệ thống</option>'];
      const has = procs.some(p => p.pid === curPid);
      if (curPid && !has) opts.push(`<option value="${esc(curPid)}">${esc(curTitle || ('PID ' + curPid))} (đã lưu)</option>`);
      for (const p of procs) opts.push(`<option value="${esc(p.pid)}">${esc(p.title)} — ${esc(p.pid)}</option>`);
      sProcess.innerHTML = opts.join('');
      sProcess.value = curPid || '';
    }
    if (sProcess) sProcess.addEventListener('change', () => {
      _audioProcessPid = sProcess.value || '';
      const sel = sProcess.options[sProcess.selectedIndex];
      _audioProcessTitle = (_audioProcessPid && sel) ? sel.textContent.replace(/\s+—\s+\d+$/, '') : '';
      api.saveSettings({ audioProcessPid: _audioProcessPid, audioProcessTitle: _audioProcessTitle });
    });
    // Mở menu ⋮ khi đang ở System → refresh danh sách tiến trình (app mới mở/đóng từ lần trước).
    if (sProcess) {
      const _mb = document.getElementById('menu-btn');
      _mb && _mb.addEventListener('click', () => { if (sCapture && sCapture.value === 'system') loadAudioProcesses(_audioProcessPid, _audioProcessTitle); });
    }

    // ── Header: đổi ngôn ngữ giao diện (🌐) + chế độ sáng/tối (🌙/☀️) — áp dụng + lưu NGAY (toggle trực tiếp) ──
    // ── Header menu (⋮): gộp ngôn ngữ dịch / ngôn ngữ app / theme / export / settings ──
    const themeBtn  = document.getElementById('theme-btn');
    const menuBtn   = document.getElementById('menu-btn');
    const appMenu   = document.getElementById('app-menu');

    // ── Flag picker: thay select ngôn ngữ (emoji cờ không render trên Windows → hiện cờ SVG) ──
    const FLAGS = {
      vi: '<svg viewBox="0 0 24 16" preserveAspectRatio="none"><rect width="24" height="16" fill="#da251d"/><path d="M12 3.2l1.27 3.9h4.1l-3.32 2.41 1.27 3.9L12 11l-3.32 2.41 1.27-3.9L6.63 7.1h4.1z" fill="#ff0"/></svg>',
      en: '<svg viewBox="0 0 24 16" preserveAspectRatio="none"><rect width="24" height="16" fill="#fff"/><g fill="#b22234"><rect width="24" height="1.23"/><rect width="24" height="1.23" y="2.46"/><rect width="24" height="1.23" y="4.92"/><rect width="24" height="1.23" y="7.38"/><rect width="24" height="1.23" y="9.85"/><rect width="24" height="1.23" y="12.31"/><rect width="24" height="1.23" y="14.77"/></g><rect width="10" height="8.6" fill="#3c3b6e"/></svg>',
      ja: '<svg viewBox="0 0 24 16" preserveAspectRatio="none"><rect width="24" height="16" fill="#fff"/><circle cx="12" cy="8" r="4.6" fill="#bc002d"/></svg>',
      ko: '<svg viewBox="0 0 24 16" preserveAspectRatio="none"><rect width="24" height="16" fill="#fff"/><circle cx="12" cy="8" r="4" fill="#0047a0"/><path d="M12 4a4 4 0 0 1 0 8 2 2 0 0 0 0-4 2 2 0 0 1 0-4z" fill="#cd2e3a"/></svg>',
      'zh-CN': '<svg viewBox="0 0 24 16" preserveAspectRatio="none"><rect width="24" height="16" fill="#de2910"/><path d="M5 3l.93 2.86h3.01L6.51 7.63l.93 2.86L5 8.72 2.56 10.49l.93-2.86L1.06 5.86h3.01z" fill="#ffde00"/><g fill="#ffde00"><circle cx="9.6" cy="2.1" r=".7"/><circle cx="11.1" cy="3.7" r=".7"/><circle cx="11.1" cy="5.9" r=".7"/><circle cx="9.6" cy="7.4" r=".7"/></g></svg>',
    };
    const LANG_FLAG_ORDER = ['vi', 'en', 'ja', 'ko', 'zh-CN'];
    const LANG_NAME = { vi: 'Tiếng Việt', en: 'English', ja: '日本語', ko: '한국어', 'zh-CN': '中文' };
    function flagInner(code) {
